<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id), esc = escapeHtml, S = WNStore;
const O = window.WNOrganize || { CABS: [], PLAN: [], checkFit: () => false, rowTags: () => ({}), plan: () => ({ cabs: [], home: new Map(), out: [], noRoom: [] }) };
const ICO = {
  box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  tool: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.4 2.4-2.6-.6-.6-2.6z"/>',
  alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
  clip: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12l2 2 4-4"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
  sup: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
};
const ic = (k) => `<span class="ic"><svg viewBox="0 0 24 24">${ICO[k]}</svg></span>`;
const chev = `<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>`;
const doc = () => WN.doc;
const items = () => doc().items.filter(x => !x.archived);
const itemById = (id) => doc().items.find(x => x.id === id);
const ST_LABEL = { instock: 'In stock', tobuy: 'To buy', putaway: 'Bought', unmarked: 'Not marked', archived: 'Archived' };

// ---------------------------------------------------------------- where things are
let IDX = null; // code → [parts], rebuilt when the data changes
function canon(loc) { const f = S.find(doc(), loc); return f ? f.slot.code : ''; }
// 10.21: a part can sit in several places, in any storage — x.location holds them comma-separated ("A1-B01, H1-D03"); the first is its main spot.
const locList = (x) => String((x && x.location) || '').split(/\s*[,;]\s*/).map(v => v.trim()).filter(Boolean);
const codesOf = (x) => [...new Set(locList(x).map(canon).filter(Boolean))];
const loc1 = (x) => codesOf(x)[0] || '';
const locKey = (v) => (canon(v) || String(v || '').trim()).toUpperCase();
function writeLocs(x, list) { const seen = new Set(), out = []; list.forEach(v => { v = String(v || '').trim(); const k = locKey(v); if (v && !seen.has(k)) { seen.add(k); out.push(canon(v) || v); } }); x.location = out.join(', '); }
const things = () => (doc().app.inventory || []).filter(t => t && (t.kind === 'tool' || t.kind === 'item' || t.kind === 'gear'));
// 10.22: supplies (tape, glue, caulk, paint, paper…) are list items with kind 'supply' — they share counts, Running low and the Checklist with parts
const isSupply = (x) => !!x && x.kind === 'supply';
const fasteners = () => items().filter(x => !isSupply(x));
const supplies = () => items().filter(isSupply);
const SUP_GROUPS = ['Tape', 'Glue & sealants', 'Painting', 'Printing & paper', 'Cleaning', 'Electrical', 'Other supplies'];
const SUP_UNITS = ['rolls', 'tubes', 'bottles', 'cans', 'packs', 'boxes', 'reams', 'sheets', 'cartridges', 'pieces'];
const GROUP_UNIT = { 'Tape': 'rolls', 'Glue & sealants': 'tubes', 'Painting': 'pieces', 'Printing & paper': 'packs', 'Cleaning': 'bottles', 'Electrical': 'pieces', 'Other supplies': 'pieces' };
const GEAR_GROUPS = ['Camera & video', 'Audio', 'Computer', 'Printers & office', 'Phones & tablets', 'Other gear'];
// things that don't have a home yet: in-stock parts and supplies without a spot, tools / gear / items without one
const noHome = () => ({ parts: fasteners().filter(x => x.store && !String(x.location || '').trim()), sup: supplies().filter(x => x.store && !String(x.location || '').trim()), th: things().filter(t => !String(t.location || '').trim()) });
const noHomeN = () => { const h = noHome(); return h.parts.length + h.sup.length + h.th.length; };
const dayDiff = (d) => { const t = new Date(String(d) + 'T12:00:00'); return isNaN(t) ? null : Math.round((t - new Date(new Date().toDateString() + ' 12:00')) / 864e5); };
const expiring = () => supplies().filter(x => x.expires && x.store && dayDiff(x.expires) != null && dayDiff(x.expires) <= 30).sort((a, b) => String(a.expires).localeCompare(String(b.expires)));
const lentOut = () => things().filter(t => String(t.lent || '').trim());
const thingById = (id) => (doc().app.inventory || []).find(t => t && t.id === id);
function nextThingId(prefix) { const ids = [...(doc().app.inventory || []).map(x => x && x.id), ...Object.keys(doc().del || {}).filter(k => k.startsWith('app.inventory:')).map(k => k.slice(14))]; const n = ids.filter(x => String(x || '').startsWith(prefix)).map(x => Number(String(x).slice(prefix.length)) || 0); return prefix + String(Math.max(0, ...n) + 1).padStart(4, '0'); }
const purposeOf = (code) => { const f = S.find(doc(), code); return f ? ((f.unit.spots || {})[f.slot.code] || '') : ''; };
const occupied = (code) => { const ix = index(); return (ix.by.get(code) || []).length + (ix.th.get(code) || []).length; };
const heldCodes = () => { const ix = index(); return [...new Set([...ix.by.keys(), ...ix.th.keys()])]; };
function thingSub(t) { return t.kind === 'tool' ? [t.type, t.brand, t.model, t.voltage, t.platform].filter(Boolean).join(' · ') || 'Tool' : t.kind === 'gear' ? [t.group, t.brand, t.model].filter(Boolean).join(' · ') || 'Gear' : (t.notes || 'Other item'); }
function index() {
  if (IDX) return IDX;
  const by = new Map(), loose = new Map(), th = new Map();
  for (const t of things()) { const c = canon(t.location); if (c) { if (!th.has(c)) th.set(c, []); th.get(c).push(t); } }
  for (const x of items()) for (const loc of locList(x)) {
    const c = canon(loc);
    if (c) { if (!by.has(c)) by.set(c, []); if (!by.get(c).includes(x)) by.get(c).push(x); }
    else { const k = loc.toUpperCase(); if (!loose.has(k)) loose.set(k, { text: loc, parts: [] }); loose.get(k).parts.push(x); }
  }
  return (IDX = { by, loose, th });
}
// 10.21: every part is in stock, low or out — a part you don't have (never bought, or 0 left) counts as out. Drawers show their worst part.
const lvlOf = (x) => !x.store || qtyNum(x) === 0 || stockLevel(x) === 'out' ? 'out' : isLow(x) ? 'low' : 'ok';
const flag = (arr) => !arr.length ? '' : arr.some(x => lvlOf(x) === 'out') ? 'r' : arr.some(x => lvlOf(x) === 'low') ? 'w' : 'g';
const lvlCount = (list) => { const c = { ok: 0, low: 0, out: 0 }; list.forEach(x => c[lvlOf(x)]++); return c; };
const lvlBar = (c, n) => hBar([[c.ok, 'var(--ok)'], [c.low, 'var(--warn)'], [c.out, 'var(--bad)']], n);
const lvlLine = (c) => `<span class="lv"><i class="g"></i>${c.ok} in stock</span><span class="lv"><i class="w"></i>${c.low} low</span><span class="lv"><i class="r"></i>${c.out} out</span>`;

// ---------------------------------------------------------------- small helpers
function shortName(x) { return String(x.name || '').replace(/\s+in\b/g, '″').replace(/\s*×\s*/g, '×'); }
function countHtml(x) { const q = qtyNum(x), lv = stockLevel(x); return q == null ? (lv ? `<span class="cnt" style="font-size:14px">${STOCK_LABEL[lv]}</span>` : '') : `<span class="cnt ${qtyClass(x)}">${q}</span>`; }
function locChip(x) {
  const l = locList(x); if (!l.length) return x.store ? `<span class="loc no">${isSupply(x) ? 'No spot' : 'No drawer'}</span>` : '';
  const c = canon(l[0]), more = l.length > 1 ? ` +${l.length - 1}` : '', all = esc(l.map(v => canon(v) || v).join(', '));
  return c ? `<span class="loc" title="${all}">${esc(c)}${more}</span>` : `<span class="loc old" title="Not on the map yet: ${all}">${esc(l[0])}${more}</span>`;
}
let terms = [];
function hl(str) { const e = esc(str), ts = terms.filter(t => t.length > 1); if (!ts.length) return e; const re = new RegExp('(' + ts.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi'); return e.split(/(&[#a-z0-9]+;)/i).map(p => /^&[#a-z0-9]+;$/i.test(p) ? p : p.replace(re, '<mark>$1</mark>')).join(''); }
// part photos: the Checklist's own (private, signed links cached on this device) or the catalog picture
const URL_STORE = 'workshop-navigator-photo-links-v1', signed = new Map((() => { try { const o = JSON.parse(localStorage.getItem(URL_STORE) || '{}'), n = Date.now(); return Object.entries(o).filter(([, v]) => v && v.exp > n); } catch (e) { return []; } })()), miss = new Map();
function photo(x, big) {
  if (x.img) return `<span class="pphoto"><img alt="" loading="lazy" referrerpolicy="no-referrer" data-img="${esc(x.img)}"${/^https:\/\//.test(x.img) ? ` src="${esc(x.img)}"` : ''}></span>`;
  const t = WNParts.thumb(x); return big ? t : `<span class="nozoom pbtn">${t}</span>`;
}
async function hydrate(scope) {
  const imgs = [...(scope || document).querySelectorAll('img[data-img^="sb:"]')].filter(i => !i.getAttribute('src')); if (!imgs.length || !WN.client || !WN.user) return;
  const now = Date.now(), paths = imgs.map(i => i.dataset.img.slice(3).replace(/\.jpg$/, '-t.jpg'));
  const need = [...new Set(paths)].filter(p => !(signed.get(p)?.exp > now + 3600e3) && !(miss.get(p) > now));
  if (need.length) { try { const { data: res, error } = await WN.client.storage.from('part-photos').createSignedUrls(need, 7 * 86400); if (!error) (res || []).forEach(r => { if (r.signedUrl && !r.error) signed.set(r.path, { url: r.signedUrl, exp: now + 7 * 86400e3 }); }); need.forEach(p => { if (!signed.has(p)) miss.set(p, now + 30 * 60e3); }); try { const o = {}; signed.forEach((v, k) => { if (v.exp > Date.now()) o[k] = v; }); localStorage.setItem(URL_STORE, JSON.stringify(o)); } catch (e) { } } catch (e) { } }
  imgs.forEach((i, k) => { const u = signed.get(paths[k])?.url; if (u) i.src = u; });
}

// ---------------------------------------------------------------- toasts
function toastEl() { const d = $('sheet'); if (d.open && !d.classList.contains('closing')) { $('toast').style.display = 'none'; return $('toastIn'); } $('toastIn').style.display = 'none'; return $('toast'); }
function toast(msg, label, fn) {
  const e = toastEl(); e.innerHTML = ''; const s = document.createElement('span'); s.textContent = msg; e.appendChild(s);
  if (label) { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = () => { e.style.display = 'none'; fn(); }; e.appendChild(b); }
  e.style.display = 'flex'; clearTimeout(toast.t); toast.t = setTimeout(() => { e.style.display = 'none'; }, label ? 7000 : 2200);
}

// ---------------------------------------------------------------- changes (the only writes this page makes: a part's drawer, storage units)
function commit() { IDX = null; WN.commit(); }
// opts: { from } move that spot to code · { add: true } keep the others and add code · { remove } take it out of that spot · none: code becomes its only spot
function setLocation(x, code, quiet, opts) {
  const prev = x.location || '', o = opts || {}; let l = locList(x), msg;
  if (o.add) { l.push(code); msg = `${x.name} also in ${canon(code) || code}`; }
  else if ('remove' in o) { const k = locKey(o.remove), i = l.findIndex(v => locKey(v) === k); if (i < 0) return; l.splice(i, 1); msg = `${x.name} taken out of ${canon(o.remove) || o.remove}`; }
  else if ('from' in o) { const k = locKey(o.from), i = o.from ? l.findIndex(v => locKey(v) === k) : -1; if (i >= 0) l[i] = code; else if (o.from || !l.length) l.push(code); else l[0] = code; msg = `${x.name} → ${canon(code) || code}`; }
  else { l = code ? [code] : []; msg = code ? `${x.name} → ${canon(code) || code}` : `${x.name} taken out of ${canon(prev) || prev}`; }
  writeLocs(x, l); if ((x.location || '') === prev) return;
  commit(); refresh();
  if (!quiet) toast(msg, 'Undo', () => { const y = itemById(x.id); if (y) { y.location = prev; commit(); refresh(); } });
}
function saveUnit(u) {
  const list = doc().locations, i = list.findIndex(l => l && l.id === u.id && l.kind === 'unit');
  u.detail = S.detail(u);
  if (i < 0) { u.order = S.units(doc()).length; list.push(u); } else list[i] = { ...u, order: list[i].order ?? i };
  commit();
}

// ---------------------------------------------------------------- routes
function route() { const h = location.hash.replace(/^#\/?/, ''); const [a, b] = h.split('/'); return { v: a || 'home', a: b ? decodeURIComponent(b) : '' }; }
// 10.21: leaving a search (tab bar, Home, Back, any link) empties the search box, so Home is never stuck showing old results
function clearQ() { const e = $('q'); if (!e || !e.value) return false; e.value = ''; $('qClear').hidden = true; if (document.activeElement === e) e.blur(); return true; }
function go(h) { clearQ(); if (location.hash === h) render(); else location.hash = h; }
window.addEventListener('hashchange', () => { clearQ(); deepLink(); render(); window.scrollTo(0, 0); });
document.addEventListener('click', (e) => { const a = e.target.closest('.tabbar a'); if (a && clearQ()) setTimeout(render, 0); }, true);
function deepLink() {
  const h = location.hash; if (h === '#scan') { history.replaceState(null, '', '#/'); render(); setTimeout(() => window.WNScan(), 300); return true; }
  const m = h.match(/^#(part|loc)=(.+)$/); if (!m) return false;
  const v = decodeURIComponent(m[2]);
  if (m[1] === 'part') { history.replaceState(null, '', '#/'); render(); openSheet('part', v); }
  else { const unit = S.units(doc()).find(u => u.id === v.toUpperCase()); if (unit) { history.replaceState(null, '', '#/storage/' + unit.id); render(); if (unit.type === 'box') openDrawer(unit.id, true); return true; }
    const f = S.find(doc(), v); history.replaceState(null, '', f ? '#/storage/' + f.unit.id : '#/storage'); render(); if (f) openDrawer(f.slot.code, true); else toast(v + ' isn’t on your storage map'); }
  return true;
}

// ---------------------------------------------------------------- views
const TAB_OF = { home: 'home', attention: 'home', parts: 'parts', supplies: 'parts', storage: 'storage', unplaced: 'storage', tools: 'tools' };
function markTab() { if (window.WNShell && WNShell.on()) return; const t = TAB_OF[route().v] || 'home'; document.querySelectorAll('.tabbar a').forEach(a => { const on = a.dataset.tab === t; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }); }
function render() { markTab();
  IDX = null;
  const q = $('q').value.trim(); terms = searchTerms(q);
  try { $('view').innerHTML = q ? searchView(q) : (VIEWS[route().v] || home)(); }
  catch (e) { console.error(e); $('view').innerHTML = `<div class="where"><div style="font-weight:800">This screen hit a problem</div><p class="note">Pull down to reload the page — that usually fixes it after an update. If it keeps happening, send a screenshot of this.</p><p class="note" style="font-family:ui-monospace,Menlo,monospace">${esc(e && e.message || e)}</p><div class="btns"><button type="button" class="gbtn" onclick="location.reload()">Reload</button><a class="gbtn" href="#/">Home</a></div></div>`; }
  hydrate($('view'));
  if (q) { const hit = $('view').querySelector('.cell.hit'); if (hit) hit.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
}
const refresh = () => { render(); if ($('sheet').open && !$('sheet').classList.contains('closing') && !sheetTyping()) paintSheet(); };
const head = (title, back, extra) => `<div class="vhead"><button type="button" class="back" data-go="${back}" aria-label="Back">‹</button><h2>${title}</h2>${extra ? `<div style="display:flex;gap:8px;flex-wrap:wrap">${extra}</div>` : ''}</div>`;

// ---------------------------------------------------------------- home page (10.9): the four cards + the Akro-Mils wall; PC adds a details section
function HD() {
  const it = fasteners(), n = it.length, c = { instock: 0, tobuy: 0, putaway: 0, unmarked: 0 }; it.forEach(x => c[itemStatus(x)]++);
  const all = items(), tobuy = all.filter(x => x.need), low = all.filter(isLow), cats = new Set(it.map(x => x.category)).size;
  const us = S.units(doc()), spots = us.reduce((a, u) => a + S.slots(u).length, 0), ix = index(), placed = [...ix.by.values()].reduce((a, v) => a + v.length, 0);
  const noDrawer = it.filter(x => x.store && !loc1(x));
  const tools = (doc().app.inventory || []).filter(t => t && (t.kind === 'tool' || t.kind === 'gear')).length, sup = supplies(), homeN = noHomeN(), exp = expiring(), lent = lentOut();
  const akro = us.filter(u => O.CABS.includes(u.id) && u.type === 'grid').map(u => { const sl = S.slots(u); let used = 0, lo = 0, out = 0; const cells = sl.map(s => { const ps = ix.by.get(s.code) || [], f = flag(ps); if (ps.length) used++; if (f === 'w') lo++; if (f === 'r') out++; return `<i class="${f}"></i>`; }).join(''); return { u, used, n: sl.length, lo, out, cells }; });
  const marked = c.instock + c.tobuy + c.putaway;
  return { it, n, c, tobuy, low, cats, us, spots, placed, noDrawer, tools, akro, marked, lv: lvlCount(it), sup, homeN, exp, lent };
}
const hBar = (parts, total) => `<div class="hbar">${parts.filter(p => p[0] > 0).map(p => `<i style="flex:${p[0]};background:${p[1]}"></i>`).join('')}${total - parts.reduce((a, p) => a + p[0], 0) > 0 ? `<i style="flex:${total - parts.reduce((a, p) => a + p[0], 0)}"></i>` : ''}</div>`;
const hRow = (name, meta, cls, go) => `<span class="hrow"${go ? ` data-part="${esc(go)}"` : ''}><span class="hn">${esc(name)}</span><b class="${cls || ''}">${meta}</b></span>`;
const miniWall = (D, big) => `<div class="hwall${big ? ' big' : ''}">${D.akro.map(a => `<span class="hcab" data-go="#/storage/${esc(a.u.id)}"><span class="hct"><b>${esc(a.u.id)}</b><small>${a.used}/${a.n}</small></span><span class="hmini">${a.cells}</span></span>`).join('')}</div>`;

function doneHtml(res) {

    + (res.autoBuy.length ? `<div class="tk-ok">Out — added to To buy: ${esc(res.autoBuy.map(x => x.name).join(', '))}</div>` : '')
    + (lows.length ? `<div class="tk-low"><b>Running low</b><p>${lows.map(x => `${esc(x.name)}: ${qtyNum(x)} left, under your low mark of ${lowAt(x)}`).join('<br>')}</p><div class="bb"><button type="button" data-act="tkbuy">Add to To buy</button><button type="button" class="n" data-act="tknotnow">Not now</button></div></div>` : '');
}
const doneBtns = () => `<button type="button" class="tk-go app-only" data-act="tknext">Scan next drawer</button><button type="button" class="tk-link" data-act="close">Done</button>`;

// ---- the take / put back sheet (one part)
function takeSheet(t) {

    <div class="tk-p">${photo(x)}<div style="min-width:0"><div class="tk-nm">${esc(x.name)}</div><div class="tk-sub">${esc(x.category || '')}${t.step === 'count' ? ' · first count' : ''}</div></div></div>`;

    <div class="tk-chips">${[-50, -25, -10, 10, 25, 50].map(v => `<button type="button" data-act="tkcq" data-v="${v}" class="${v < 0 ? 'neg' : 'pos'}">${v < 0 ? '−' + (-v) : '+' + v}</button>`).join('')}</div>

  const nOn = set.filter(e => t.on[e.x.id]).length, total = setTotal(t, set), verb = take ? 'Take' : 'Put back';

// Each matching part has its own amount: "per bolt" × how many bolts (1 bolt → 2 flat washers keeps 2 per bolt when you take 4).
const perKey = (gw, role) => 'wn-per:' + (gw.me.thread || gw.me.dia) + ':' + role;

}

// ---- what's in a drawer (a QR label, a drawer with several parts, or tools)

    return `<div class="dr-row" data-find="${esc(normS(x.name + ' ' + (x.type || '')))}">${x.kind === 'tool' ? toolIc : x.kind === 'gear' ? gearIc : itemIc}<span class="t"><button type="button" data-act="thing" data-id="${esc(x.id)}">${esc(x.name)}</button><span class="${out ? 'r' : ''}">${out ? (x.out ? 'Out since ' + esc(fmtDay(x.out)) : 'Out') : 'Here'}</span></span><div class="dr-seg" role="group" aria-label="${esc(x.name)} here or out"><button type="button" data-act="drtool" data-id="${esc(x.id)}" data-v="here" class="${out ? '' : 'here'}">Here</button><button type="button" data-act="drtool" data-id="${esc(x.id)}" data-v="out" class="${out ? 'out' : ''}">Out</button></div></div>`; };

function drSave(t) {

// ---- open the right sheet for a scanned or tapped drawer
// Data Matrix (Akro-Mils side label) with one part → take / put back. A QR, or a drawer holding several things → what's in it.
function openDrawer(code, viaQR) {
  const f = S.find(doc(), code); if (!f) return false;
  const ix = index(), ps = ix.by.get(f.slot.code) || [], ts = ix.th.get(f.slot.code) || [];
  if (!viaQR && ps.length === 1 && !ts.length) openSheet('take', ps[0].id, false, { code: f.slot.code });
  else if (!ps.length && !ts.length) openSheet('slot', f.slot.code);

}
function scanFlow() {
  P.scanCode().then(code => {
    code = String(code || '').trim(); if (!code) return;
    const lk = code.match(/[#&?]loc=([^&#]+)/), viaQR = !!lk || /^https?:/i.test(code);   // a QR label holds a link to its drawer
    if (lk) code = decodeURIComponent(lk[1]);
    if (sheet.open) closeSheet();
    const unit = S.units(doc()).find(u => u.id === code.toUpperCase());
    if (unit && unit.type === 'box') { qEl.value = ''; $('qClear').hidden = true; go('#/storage/' + unit.id); setTimeout(() => openDrawer(unit.id, true), 120); return; }   // a tote / case → what's inside
    if (unit) { go('#/storage/' + unit.id); return; }                                    // a cabinet's QR → its map
    const f = S.find(doc(), code);
    if (f) { qEl.value = ''; $('qClear').hidden = true; go('#/storage/' + f.unit.id); setTimeout(() => openDrawer(f.slot.code, viaQR), 120); return; }
    if (itemById(code)) { openSheet('take', code); return; } if (thingById(code)) { openSheet('thing', code); return; }
    qEl.value = code; $('qClear').hidden = false; render(); toast('Scanned: ' + code);
  }, e => toast(e.message));
}
window.WNScan = () => { if (sheet.open) closeSheet(); setTimeout(scanFlow, sheet.open ? 220 : 0); };

// ---- goes with: shown on a part, in search, and for what's on the To buy list

  const lensTitle = gw.me.role === 'bolt' ? `Other ${esc(gw.me.thread || gw.me.dia)} lengths` : `Fits ${esc(gw.me.thread || gw.me.dia)}`;
  return `<div class="gw-card where" style="box-shadow:none;border:1px solid var(--line)">${comp.length ? `<div class="h3" style="margin:0 2px 8px">Goes with</div><div class="gw-grid">${comp.map(cell).join('')}</div>` : ''}
    ${need.length ? `<div class="btns"><button type="button" class="pbtn2" data-act="gwbuy" data-ids="${esc(need.map(e => e.y.id).join(','))}">Add ${need.length === 1 ? esc(shortName(need[0].y)) : need.length + ' of these'} to To buy</button></div>` : ''}
    ${lens.length && !(opts && opts.noLens) ? `<div class="h3" style="margin:12px 2px 8px">${lensTitle}</div><div class="gw-chips">${lens.map(b => `<button type="button" data-act="gwopen" data-id="${esc(b.id)}">${esc(shortName(b))}${loc1(b) ? ' · ' + esc(loc1(b)) : ''}</button>`).join('')}</div>` : ''}</div>`;

// codes to light up on a map next to the part's own drawer
function gwCodes(x) { const gw = SETS.goesWith(x, items()); return gw ? ['flat', 'lock', 'nut', 'nyloc'].flatMap(k => gw[k] ? codesOf(gw[k].x) : []) : []; }
// To buy: matching nuts / washers that are also out or low
function gwForBuying() {
  const seen = new Set(), out = [];
  for (const x of items().filter(y => y.need)) { const gw = SETS.goesWith(x, items()); if (!gw) continue;
    for (const k of ['flat', 'lock', 'nut']) { const y = gw[k] && gw[k].x; if (!y || y.need || seen.has(y.id)) continue; const lv = stockLevel(y); if (lv === 'out' || lv === 'low' || !y.store) { seen.add(y.id); out.push({ y, for: x }); } } }

mb.onclick = (e) => { e.stopPropagation(); if (menu.classList.contains('on')) return closeMenu(); const r = mb.getBoundingClientRect(); menu.style.top = (r.bottom + 8) + 'px'; menu.style.right = Math.max(10, innerWidth - r.right) + 'px'; menu.classList.add('on'); mb.setAttribute('aria-expanded', 'true'); };
document.addEventListener('pointerdown', (e) => { if (menu.classList.contains('on') && !menu.contains(e.target) && e.target !== mb && !mb.contains(e.target)) closeMenu(); });
function paintSync() { const s = WN.status || {}, d = $('syncDot'); d.className = 'dot ' + (s.state === 'live' ? 'ok' : s.state === 'busy' ? 'busy' : s.state === 'error' || s.state === 'paused' ? 'err' : ''); $('syncChip').title = s.msg || ''; }
$('syncChip').onclick = () => { const s = WN.status || {}; if (!WN.user) toast('Not signed in — sign in on the Checklist', 'Sign in', () => { WNShell.show('#settings'); }); else if (s.state === 'live') toast(s.msg || 'Synced'); else { toast('Syncing…'); WN.syncNow().then(() => toast((WN.status || {}).msg || 'Synced'), e => toast('Sync problem: ' + (e.message || e))); } };
WN.on('status', paintSync); WN.on('auth', () => { paintSync(); hydrate(document); });
WN.on('change', (d, src) => { if (src === 'local') return; refresh(); paintBadge(); drain(); });
$('today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
window.WS = { go, render, openSheet, closeSheet, get stack() { return stack; } }; // for tests
paintSync(); paintBadge(); if (!deepLink()) render(); setTimeout(drain, 1500);
})();

<style>#wnCL{position:fixed;inset:0;width:100%;height:100%;border:0;margin:0;padding:0;z-index:900;background:var(--bg);visibility:hidden;pointer-events:none}html.wn-cl #wnCL{visibility:visible;pointer-events:auto}</style>
<script>
// 10.21: the Checklist lives inside this screen (loaded quietly in the background), so Home ↔ Checklist switches
// instantly — no page load, no flash, and the bar's bubble glides once — exactly like Home ↔ Parts.
window.WNShell = (function () {
  const de = document.documentElement;
  let fr = null, ready = false, pend = null, hideT = 0;
  const win = () => { try { return fr && fr.contentWindow; } catch (e) { return null; } };
  const api = () => { const w = win(); return ready && w && w.WNCL ? w.WNCL : null; };
  function sa() { const p = document.createElement('div'); p.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;top:0;left:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)'; document.body.appendChild(p); const c = getComputedStyle(p), r = { top: c.paddingTop, right: c.paddingRight, bottom: c.paddingBottom, left: c.paddingLeft }; p.remove(); return r; }
  function pushSA() { try { const s = sa(), st = fr.contentDocument.documentElement.style; for (const k in s) st.setProperty('--wsa-' + k, s[k]); } catch (e) { } }
  function make() {
    if (fr) return fr;
    fr = document.createElement('iframe'); fr.id = 'wnCL'; fr.title = 'Checklist'; fr.setAttribute('aria-hidden', 'true'); fr.setAttribute('tabindex', '-1');
    fr.addEventListener('load', () => { ready = true; pushSA(); if (pend != null) { const h = pend; pend = null; run(h); } if (on()) markIn(); });
    fr.src = 'index.html?checklist&embed=1';
    document.body.appendChild(fr);
    return fr;
  }
  function run(h) { const a = api(); if (!a) { pend = h; return; } try { a.go(h || ''); } catch (e) { } }
  const on = () => de.classList.contains('wn-cl');
  function markIn() { const a = api(); WNBar.mark(a && a.inSettings() ? null : 'checklist'); }
  function top() { try { const w = win(); w.scrollTo(0, 0); } catch (e) { } }
  // show the Checklist (h: '' = the list, '#settings', '#add', '#edit=ID')
  function show(h, instant) {
    make(); clearTimeout(hideT);
    document.querySelectorAll('dialog[open]').forEach(d => { try { d.close(); } catch (e) { } });
    const was = on();
    if (h) run(h); else if (!was) { top(); }
    if (!was) { de.classList.add('wn-cl'); fr.removeAttribute('aria-hidden'); }
    markIn(); if (instant) WNBar.sync(true);
  }
  function hide() { clearTimeout(hideT); if (!on()) return; de.classList.remove('wn-cl'); fr.setAttribute('aria-hidden', 'true'); try { if (document.activeElement === fr) fr.blur(); } catch (e) { } }
  // hide on the next page change, so the new Workshop page and the hiding land in the same frame (no flash of the old page)
  function hideOnHash() { const f = () => { window.removeEventListener('hashchange', f); hide(); }; window.addEventListener('hashchange', f); hideT = setTimeout(f, 400); }
  // go to a Workshop place from inside the Checklist
  function goW(h) { h = h || '#/'; const cur = location.hash || '#/'; if (cur === h || (h === '#/' && !location.hash)) { hide(); window.scrollTo(0, 0); } else { hideOnHash(); location.hash = h; } }
  const act = (a) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.act = a; b.hidden = true; document.body.appendChild(b); b.click(); b.remove(); };
  function leave(h) {
    if (h === '#notifs') return window.WNBell && WNBell.open();
    if (h === '#scan') { hide(); return window.WNScan ? window.WNScan() : act('scancode'); }
    if (/^#act=/.test(h)) { goW('#/storage'); setTimeout(() => act(h.slice(5)), 60); return; }
    goW(h || '#/');
  }
  // the Checklist tab tapped while you're on it: from Settings it goes back to the list; otherwise nothing (the bar blinks)
  function back() { const a = api(); return !!(a && a.back()); }
  function reset() { hide(); if (fr) { fr.remove(); fr = null; ready = false; pend = null; } setTimeout(make, 700); }
  // links that used to open the Checklist page (Edit in Checklist, Account & sync…) open it here instead
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href^="index.html"]'); if (!a || e.defaultPrevented) return;
    const href = a.getAttribute('href'), i = href.indexOf('#'); e.preventDefault(); show(i >= 0 ? href.slice(i) : '');
  }, true);
  window.addEventListener('resize', () => { if (ready) pushSA(); });
  return { sa, show, hide, hideOnHash, goW, leave, back, reset, on, make };
})();
</script>
<script>
// 10.21: bottom bar with the + menu (replaces the gear) — js/tabbar.js
WNBar.mount({ page: 'workshop', run: (k) => {

  switch (k) {

    case 'organize': if (WNShell.on()) { WNShell.goW('#/storage'); setTimeout(() => act('organize'), 60); return; } return act('organize');
    case 'settings': return WNShell.show('#settings');

// the Checklist's + panel sends you here with #act=… for the Workshop-only actions (labels, custom label, organize)

document.getElementById('bellBtn').onclick = () => WNBell.open();
if (location.hash === '#notifs') { history.replaceState(null, '', '#/'); setTimeout(() => WNBell.open(), 200); }
</script>
