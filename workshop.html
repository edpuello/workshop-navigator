<style>

.ph{display:flex;gap:14px;align-items:center;margin-bottom:14px}.ph .pthumb,.ph .pphoto{width:72px!important;height:72px!important;border-radius:18px!important}.ph .pthumb img{max-width:64px!important;max-height:56px!important}

<script>WN.init(WN_SEED)</script>
<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id), esc = escapeHtml, S = WNStore;
const O = window.WNOrganize || { CABS: [], PLAN: [], checkFit: () => false, rowTags: () => ({}), plan: () => ({ cabs: [], home: new Map(), out: [], noRoom: [] }) };
const ICO = {
  box: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  tool: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8V21h3.2l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.4 2.4-2.6-.6-.6-2.6z"/>',
  alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
  clip: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12l2 2 4-4"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
};
const ic = (k) => `<span class="ic"><svg viewBox="0 0 24 24">${ICO[k]}</svg></span>`;
const chev = `<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>`;
const doc = () => WN.doc;
const items = () => doc().items.filter(x => !x.archived);
const itemById = (id) => doc().items.find(x => x.id === id);
const ST_LABEL = { instock: 'In stock', tobuy: 'To buy', putaway: 'Bought', unmarked: 'Not marked', archived: 'Archived' };

// ---------------------------------------------------------------- where things are
let IDX = null; // code → [parts], rebuilt when the data changes
function canon(loc) { const f = S.find(doc(), loc); return f ? f.slot.code : ''; }
const things = () => (doc().app.inventory || []).filter(t => t && (t.kind === 'tool' || t.kind === 'item'));
const thingById = (id) => (doc().app.inventory || []).find(t => t && t.id === id);
function nextThingId(prefix) { const ids = [...(doc().app.inventory || []).map(x => x && x.id), ...Object.keys(doc().del || {}).filter(k => k.startsWith('app.inventory:')).map(k => k.slice(14))]; const n = ids.filter(x => String(x || '').startsWith(prefix)).map(x => Number(String(x).slice(prefix.length)) || 0); return prefix + String(Math.max(0, ...n) + 1).padStart(4, '0'); }
const purposeOf = (code) => { const f = S.find(doc(), code); return f ? ((f.unit.spots || {})[f.slot.code] || '') : ''; };
const occupied = (code) => { const ix = index(); return (ix.by.get(code) || []).length + (ix.th.get(code) || []).length; };
const heldCodes = () => { const ix = index(); return [...new Set([...ix.by.keys(), ...ix.th.keys()])]; };
function thingSub(t) { return t.kind === 'tool' ? [t.type, t.brand, t.model, t.voltage, t.platform].filter(Boolean).join(' · ') || 'Tool' : (t.notes || 'Other item'); }
function index() {
  if (IDX) return IDX;
  const by = new Map(), loose = new Map(), th = new Map();
  for (const t of things()) { const c = canon(t.location); if (c) { if (!th.has(c)) th.set(c, []); th.get(c).push(t); } }
  for (const x of items()) {
    const loc = String(x.location || '').trim(); if (!loc) continue;
    const c = canon(loc);
    if (c) { if (!by.has(c)) by.set(c, []); by.get(c).push(x); }
    else { const k = loc.toUpperCase(); if (!loose.has(k)) loose.set(k, { text: loc, parts: [] }); loose.get(k).parts.push(x); }
  }
  return (IDX = { by, loose, th });
}
const flag = (arr) => arr.some(x => x.store && stockLevel(x) === 'out') ? 'r' : arr.some(isLow) ? 'w' : '';

// ---------------------------------------------------------------- small helpers
function shortName(x) { return String(x.name || '').replace(/\s+in\b/g, '″').replace(/\s*×\s*/g, '×'); }
function countHtml(x) { const q = qtyNum(x), lv = stockLevel(x); return q == null ? (lv ? `<span class="cnt" style="font-size:14px">${STOCK_LABEL[lv]}</span>` : '') : `<span class="cnt ${qtyClass(x)}">${q}</span>`; }
function locChip(x) {
  const loc = String(x.location || '').trim(); if (!loc) return x.store ? '<span class="loc no">No drawer</span>' : '';
  const c = canon(loc); return c ? `<span class="loc">${esc(c)}</span>` : `<span class="loc old" title="Not on the map yet">${esc(loc)}</span>`;
}
let terms = [];
function hl(str) { const e = esc(str), ts = terms.filter(t => t.length > 1); if (!ts.length) return e; const re = new RegExp('(' + ts.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi'); return e.split(/(&[#a-z0-9]+;)/i).map(p => /^&[#a-z0-9]+;$/i.test(p) ? p : p.replace(re, '<mark>$1</mark>')).join(''); }
// part photos: the Checklist's own (private, signed links cached on this device) or the catalog picture
const URL_STORE = 'workshop-navigator-photo-links-v1', signed = new Map((() => { try { const o = JSON.parse(localStorage.getItem(URL_STORE) || '{}'), n = Date.now(); return Object.entries(o).filter(([, v]) => v && v.exp > n); } catch (e) { return []; } })()), miss = new Map();
function photo(x, big) {
  if (x.img) return `<span class="pphoto"><img alt="" loading="lazy" referrerpolicy="no-referrer" data-img="${esc(x.img)}"${/^https:\/\//.test(x.img) ? ` src="${esc(x.img)}"` : ''}></span>`;
  const t = WNParts.thumb(x); return big ? t : `<span class="nozoom pbtn">${t}</span>`;
}
async function hydrate(scope) {
  const imgs = [...(scope || document).querySelectorAll('img[data-img^="sb:"]')].filter(i => !i.getAttribute('src')); if (!imgs.length || !WN.client || !WN.user) return;
  const now = Date.now(), paths = imgs.map(i => i.dataset.img.slice(3).replace(/\.jpg$/, '-t.jpg'));
  const need = [...new Set(paths)].filter(p => !(signed.get(p)?.exp > now + 3600e3) && !(miss.get(p) > now));
  if (need.length) { try { const { data: res, error } = await WN.client.storage.from('part-photos').createSignedUrls(need, 7 * 86400); if (!error) (res || []).forEach(r => { if (r.signedUrl && !r.error) signed.set(r.path, { url: r.signedUrl, exp: now + 7 * 86400e3 }); }); need.forEach(p => { if (!signed.has(p)) miss.set(p, now + 30 * 60e3); }); try { const o = {}; signed.forEach((v, k) => { if (v.exp > Date.now()) o[k] = v; }); localStorage.setItem(URL_STORE, JSON.stringify(o)); } catch (e) { } } catch (e) { } }
  imgs.forEach((i, k) => { const u = signed.get(paths[k])?.url; if (u) i.src = u; });
}

// ---------------------------------------------------------------- toasts
function toastEl() { const d = $('sheet'); if (d.open && !d.classList.contains('closing')) { $('toast').style.display = 'none'; return $('toastIn'); } $('toastIn').style.display = 'none'; return $('toast'); }
function toast(msg, label, fn) {
  const e = toastEl(); e.innerHTML = ''; const s = document.createElement('span'); s.textContent = msg; e.appendChild(s);
  if (label) { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = () => { e.style.display = 'none'; fn(); }; e.appendChild(b); }
  e.style.display = 'flex'; clearTimeout(toast.t); toast.t = setTimeout(() => { e.style.display = 'none'; }, label ? 7000 : 2200);
}

// ---------------------------------------------------------------- changes (the only writes this page makes: a part's drawer, storage units)
function commit() { IDX = null; WN.commit(); }
function setLocation(x, code, quiet) {
  const prev = x.location || ''; if ((prev || '') === (code || '')) return;
  x.location = code || ''; commit(); refresh();
  if (!quiet) toast(code ? `${x.name} → ${code}` : `${x.name} removed from ${canon(prev) || prev}`, 'Undo', () => { const y = itemById(x.id); if (y) { y.location = prev; commit(); refresh(); } });
}
function saveUnit(u) {
  const list = doc().locations, i = list.findIndex(l => l && l.id === u.id && l.kind === 'unit');
  u.detail = S.detail(u);
  if (i < 0) { u.order = S.units(doc()).length; list.push(u); } else list[i] = { ...u, order: list[i].order ?? i };
  commit();
}

// ---------------------------------------------------------------- routes
function route() { const h = location.hash.replace(/^#\/?/, ''); const [a, b] = h.split('/'); return { v: a || 'home', a: b ? decodeURIComponent(b) : '' }; }
function go(h) { if (location.hash === h) render(); else location.hash = h; }
window.addEventListener('hashchange', () => { deepLink(); render(); window.scrollTo(0, 0); });
function deepLink() {
  const h = location.hash, m = h.match(/^#(part|loc)=(.+)$/); if (!m) return false;
  const v = decodeURIComponent(m[2]);
  if (m[1] === 'part') { history.replaceState(null, '', '#/'); render(); openSheet('part', v); }
  else { const f = S.find(doc(), v); history.replaceState(null, '', f ? '#/storage/' + f.unit.id : '#/storage'); render(); if (f) openSheet('slot', f.slot.code); else toast(v + ' isn’t on your storage map'); }
  return true;
}

// ---------------------------------------------------------------- views
function render() {
  IDX = null;
  const q = $('q').value.trim(); terms = searchTerms(q);
  try { $('view').innerHTML = q ? searchView(q) : (VIEWS[route().v] || home)(); }
  catch (e) { console.error(e); $('view').innerHTML = `<div class="where"><div style="font-weight:800">This screen hit a problem</div><p class="note">Pull down to reload the page — that usually fixes it after an update. If it keeps happening, send a screenshot of this.</p><p class="note" style="font-family:ui-monospace,Menlo,monospace">${esc(e && e.message || e)}</p><div class="btns"><button type="button" class="gbtn" onclick="location.reload()">Reload</button><a class="gbtn" href="#/">Home</a></div></div>`; }
  hydrate($('view'));
  if (q) { const hit = $('view').querySelector('.cell.hit'); if (hit) hit.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
}
const refresh = () => { render(); if ($('sheet').open && !$('sheet').classList.contains('closing') && !sheetTyping()) paintSheet(); };
const head = (title, back, extra) => `<div class="vhead"><button type="button" class="back" data-go="${back}" aria-label="Back">‹</button><h2>${title}</h2>${extra ? `<div style="display:flex;gap:8px;flex-wrap:wrap">${extra}</div>` : ''}</div>`;

function home() {
  const it = items(), n = it.length, c = { instock: 0, tobuy: 0, putaway: 0, unmarked: 0 }; it.forEach(x => c[itemStatus(x)]++);
  const tobuy = it.filter(x => x.need).length, low = it.filter(isLow).length, cats = new Set(it.map(x => x.category)).size;
  const us = S.units(doc()), spots = us.reduce((a, u) => a + S.slots(u).length, 0), ix = index(), placed = [...ix.by.values()].reduce((a, v) => a + v.length, 0);
  const noDrawer = it.filter(x => x.store && !canon(x.location)).length;
  const tools = (doc().app.inventory || []).filter(t => t && t.kind === 'tool').length;
  return `<div class="cards">
  <button type="button" class="card" data-go="#/parts">${chev}<div class="k">${ic('box')}Parts</div><div class="n">${n}</div><div class="s">${c.instock} in stock · ${cats} families</div></button>
  <button type="button" class="card" data-go="#/attention">${chev}<div class="k">${ic('alert')}Needs attention</div><div class="att"><span>To buy</span><b class="${tobuy ? 'r' : ''}">${tobuy}</b><span>Running low</span><b class="${low ? 'w' : ''}">${low}</b><span>Not put away</span><b>${c.putaway}</b></div></button>
  <button type="button" class="card" data-go="#/storage">${chev}<div class="k">${ic('grid')}Storage</div>${us.length ? `<div class="n">${us.length}</div><div class="s">units · ${spots} spots · ${placed} parts placed${noDrawer ? `<br>${noDrawer} in stock without a drawer` : ''}</div>` : `<div class="s" style="margin-top:6px">Map your drawers so search can show exactly where a part is.</div><span class="soon">Set up</span>`}</button>
  <button type="button" class="card" data-go="#/tools">${chev}<div class="k">${ic('tool')}Tools</div><div class="n">${tools}</div><div class="s">${tools ? 'with brand, model, serial' : 'Add your tools — brand, model, serial, battery'}${things().length - tools ? ` · ${things().length - tools} other items` : ''}</div></button>
  <a class="card wide" href="index.html">${ic('clip')}<div style="flex:1"><div style="font-weight:800;font-size:16px">Purchase Checklist</div><div class="s">Counts, buying and photos live there</div></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2.2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></a>
  </div><p class="foot">Search finds any part and shows its drawer on the map.<br>Same parts and numbers as the Checklist — change counts there.<br><span style="opacity:.7">Version 10.2 · Nov 3</span></p>`;
}
function partRow(x) {
  const st = itemStatus(x);
  return `<button type="button" class="row" data-part="${esc(x.id)}">${photo(x)}<div class="t"><b>${hl(x.name)}</b><div class="pills"><span class="pill st-${st}">${ST_LABEL[st]}</span>${x.store && x.need ? '<span class="pill st-tobuy">Reorder</span>' : ''}</div></div><div class="rt">${countHtml(x)}${locChip(x)}</div></button>`;
}
function sortedParts(list) { const idx = orderIndex(doc().items), cats = [...new Set(list.map(x => x.category))]; return cats.flatMap(c => sortCat(list.filter(x => x.category === c), idx)); }
function parts() {
  const it = items(), cats = [...new Set(sortCat(it, orderIndex(doc().items)).map(x => x.category))];
  const fam = (cat) => { const l = it.filter(x => x.category === cat), s = l.filter(x => x.store).length, b = l.filter(x => x.need).length, w = l.filter(isLow).length; return `<button type="button" class="row" data-go="#/parts/${encodeURIComponent(cat)}"><div class="t"><b>${esc(cat || 'Other')}</b><span>${s} in stock${b ? ` · ${b} to buy` : ''}${w ? ` · ${w} low` : ''}</span></div><span class="cnt" style="color:var(--ink2)">${l.length}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2.2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>`; };
  return head(`Parts <span style="color:var(--ink3);font-weight:700">${it.length}</span>`, '#/') + `<div class="rows">${cats.map(fam).join('') || '<div class="empty">No parts yet. Add them on the Checklist.</div>'}</div>`;
}
function family(cat) {
  const list = sortedParts(items().filter(x => x.category === cat));
  return head(esc(cat) + ` <span style="color:var(--ink3);font-weight:700">${list.length}</span>`, '#/parts') + `<div class="rows">${list.map(partRow).join('') || '<div class="empty">Nothing here.</div>'}</div>`;
}
function attention() {
  const it = items(), sec = (t, l) => l.length ? `<div class="h3">${t} <span class="c">${l.length}</span></div><div class="rows">${sortedParts(l).map(partRow).join('')}</div>` : '';
  const body = sec('To buy', it.filter(x => x.need)) + sec('Running low', it.filter(isLow)) + sec('Bought, not put away', it.filter(x => itemStatus(x) === 'putaway'));
  return head('Needs attention', '#/') + (body || '<div class="rows"><div class="empty">Nothing needs attention. 👍</div></div>');
}
function storage() {
  const us = S.units(doc()), ix = index();
  if (!us.length) return head('Storage', '#/') + `<div class="where"><div style="font-weight:800;font-size:17px">Set up your storage map</div><p class="note">Each drawer, bin and shelf gets a short code (like <b>A2-C05</b>) for its label and QR code. Here's your storage from what you told me — you can change any of it afterwards.</p>
   <div class="rows" style="box-shadow:none;border:1px solid var(--line)">${S.MY_UNITS.map(u => `<div class="row" style="min-height:52px"><span class="loc">${u.id}</span><div class="t"><b>${esc(u.name)}</b><span>${S.slots(u).length} spots · ${esc(u.model)}</span></div></div>`).join('')}</div>
   <div class="btns"><button type="button" class="pbtn2" data-act="setup">Add my storage</button><button type="button" class="gbtn" data-act="newunit">Add a different unit</button></div></div>`;
  const ups = typeof S.pendingUpdates === 'function' ? S.pendingUpdates(doc()) : [], upHtml = ups.length ? `<div class="where" style="border:1.5px solid #c9dbef"><div style="font-weight:800">Layout updates ready</div><p class="note" style="margin:4px 0 8px">From what you told me. Nothing changes until you tap Apply.</p>${ups.map(x => `<div class="row" style="padding:8px 0;min-height:0"><span class="loc">${esc(x.id)}</span><div class="t"><b style="font-size:14.5px">${esc(x.text)}</b></div><button type="button" class="pbtn2" data-act="applyupd" data-unit="${esc(x.id)}">Apply</button></div>`).join('')}</div>` : '';
  const loose = [...ix.loose.values()], noDrawer = items().filter(x => x.store && !String(x.location || '').trim());
  const ucard = (u) => { const sl = S.slots(u), used = sl.filter(s => occupied(s.code)), lowN = used.filter(s => flag(ix.by.get(s.code) || [])).length; return `<button type="button" class="card ucard" data-go="#/storage/${esc(u.id)}"><span class="code">${esc(u.id)}</span><div class="k" style="padding-right:44px">${esc(u.name)}</div><div class="s">${esc(u.model || '')}</div><div class="s" style="margin-top:auto">${used.length} of ${sl.length} used${lowN ? ` · <b style="color:#b07205">${lowN} low</b>` : ''}</div><div class="meter"><i style="width:${sl.length ? Math.round(used.length / sl.length * 100) : 0}%"></i></div></button>`; };
  return head('Storage', '#/', '<button type="button" class="gbtn" data-act="newunit">Add unit</button>') + upHtml + orgBanner() + `<div class="cards">${us.map(ucard).join('')}</div>` +
    (loose.length ? `<div class="h3">Not on the map yet <span class="c">${loose.reduce((a, l) => a + l.parts.length, 0)}</span></div><p class="note">These parts have a location typed in that isn't one of your map codes.</p><div class="rows">${loose.map(l => { const sug = S.suggest(l.text), ok = sug && S.find(doc(), sug); return `<div class="row"><span class="loc old">${esc(l.text)}</span><div class="t"><b>${l.parts.length} part${l.parts.length > 1 ? 's' : ''}</b><span>${esc(l.parts.map(x => x.name).join(', '))}</span></div>${ok ? `<button type="button" class="gbtn" data-act="convert" data-from="${esc(l.text)}" data-to="${esc(sug)}">Use ${esc(sug)}</button>` : `<button type="button" class="gbtn" data-part="${esc(l.parts[0].id)}">Place</button>`}</div>`; }).join('')}</div>` : '') +
    (noDrawer.length ? `<div class="h3">To put away</div><div class="rows"><button type="button" class="row" data-go="#/unplaced"><div class="t"><b>In stock, no drawer yet</b><span>Tap to see them and give each one a spot</span></div><span class="cnt" style="color:var(--ink2)">${noDrawer.length}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2.2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button></div>` : '');
}
// Draw a unit. hit = code to highlight. compact = no names (used inside sheets).
function mapHtml(u, hit, compact) {
  const ix = index(), spots = u.spots || {}, cell = (s, list) => { const ps = [...(ix.by.get(s.code) || []), ...(ix.th.get(s.code) || [])], f = flag(ix.by.get(s.code) || []), h = s.code === hit, tall = s.h > 1 ? ` style="min-height:${Math.round(40 * s.h)}px"` : '', pur = spots[s.code] || '';
    const empty = pur ? `<span style="color:var(--ink3);font-style:italic">For: ${esc(pur)}</span>` : '<span style="color:var(--ink3)">Empty</span>';
    const names = list ? `<span class="cn">${ps.length ? esc(ps.map(shortName).join(' · ')) : empty}</span>` : (!compact && (ps.length || pur) ? `<span class="cn"${ps.length ? '' : ' style="font-style:italic;color:var(--ink3)"'}>${esc(ps.length ? shortName(ps[0]) : pur)}</span>` : '');
    return `<button type="button" class="cell${ps.length ? ' has' : pur ? ' pur' : ''}${h ? ' hit' : ''}"${tall} data-slot="${esc(s.code)}" aria-label="${esc(s.code)}${ps.length ? ': ' + esc(ps.map(x => x.name).join(', ')) : pur ? ', for ' + esc(pur) : ', empty'}"><span class="cl">${esc(s.label)}</span>${names}${ps.length > 1 && !list ? `<span class="k2">${ps.length}</span>` : ''}${f ? `<i class="d ${f}"></i>` : ''}</button>`; };
  const sl = S.slots(u), grid = (cells, cols) => `<div class="mgrid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${cells}</div>`;
  if (u.type === 'grid' && u.rowTags) { // organized by size: each row starts with its size
    const body = [...new Set(sl.map(s => s.r))].map(r => rtagHtml(u.rowTags[S.ROWS[r]], S.ROWS[r]) + sl.filter(s => s.r === r).map(s => cell(s)).join('')).join('');
    return `<div class="map"><div class="mgrid" style="grid-template-columns:40px repeat(${u.cols},minmax(0,1fr))">${body}</div><div class="mapcap"><span>Row A = top · each row is one size</span><span>Drawer 1 = left</span></div></div>`; }
  if (u.type === 'grid') return `<div class="map">${grid(sl.map(s => cell(s)).join(''), u.cols)}<div class="mapcap"><span>Row A = top</span><span>Drawer 1 = left</span></div></div>`;
  if (u.type === 'bins') return `<div class="map">${grid(sl.map(s => cell(s)).join(''), Math.min(u.cols || 6, Math.max(1, sl.length)))}</div>`;
  if (u.type === 'stack') return `<div class="map stack">${grid(sl.map(s => cell(s, true)).join(''), 1)}<div class="mapcap"><span>D01 = top drawer</span></div></div>`;
