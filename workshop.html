<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workshop App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#122d4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workshop">
<meta name="format-detection" content="telephone=no">
<style>
/* Layout: rounded sidebar panel + content canvas on iPad (rail when collapsed); header, pill tabs and floating tab bar on iPhone. Single dark look. */
:root{
  color-scheme:dark;
  --bg:#0c0c0e; --panel:#151619; --card:#1b1c20; --card-2:#24252b; --card-3:#2e3036;
  --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.1);
  --ink:#f3f3f5; --ink-2:#a6a8b0; --ink-3:#6f717a;
  --accent:#6c5cff; --accent-2:#8d80ff; --accent-glow:rgba(108,92,255,.45); --accent-soft:rgba(108,92,255,.16);
  --good:#4fd18b; --warn:#f2b46d; --bad:#f2716b;
  --mint:#8fe3cf; --mint-ink:#0d2c25; --peach:#f5c29b; --peach-ink:#3d210d;
  --font:"Geist",ui-sans-serif,-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --r-lg:24px; --r-md:18px; --r-sm:12px;
  --sbw:272px;
  --g1:#5b6cff; --g2:#d062ff; --logo-bg:#ffffff;
}
html[data-area="buy"]{--accent:#24b08f; --accent-2:#5fd8b8; --accent-glow:rgba(36,176,143,.42); --accent-soft:rgba(36,176,143,.16); --g1:#1fa385; --g2:#a6ecd9; --logo-bg:#8fe3cf}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}
svg.i.xs{width:15px;height:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);gap:20px;min-height:100%;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:grid-template-columns .25s ease}
.app.rail{--sbw:84px}
.side{position:sticky;top:16px;height:calc(100dvh - 32px);background:var(--panel);border-radius:var(--r-lg);padding:20px 14px 14px;display:flex;flex-direction:column;gap:6px;z-index:30}
.side-scroll{display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;margin:0 -4px;padding:0 4px}
.brand{display:flex;align-items:center;gap:12px;padding:0 4px 14px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--logo-bg);transition:background .25s;color:#0c0c0e;display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px;stroke-width:2.4}
.brand b{font-size:19px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.collapse{position:absolute;right:-20px;top:24px;width:40px;height:40px;border-radius:50%;background:var(--card-2);border:4px solid var(--bg);display:grid;place-items:center;color:var(--ink)}
.collapse:hover{background:var(--card-3)}
.search{display:flex;align-items:center;gap:10px;height:44px;border:1px solid var(--line-2);border-radius:14px;padding:0 8px 0 12px;color:var(--ink-3);margin-bottom:10px;background:transparent;width:100%;text-align:left}
.search span{flex:1;white-space:nowrap}
kbd{font:500 12px var(--font);color:var(--ink-2);border:1px solid var(--line-2);border-radius:7px;min-width:24px;height:24px;display:inline-grid;place-items:center;padding:0 5px}
.nav{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:14px;border:0;background:transparent;color:var(--ink-2);width:100%;text-align:left;position:relative;font-size:15px;flex:none}
.nav:hover{background:rgba(255,255,255,.03);color:var(--ink)}
.nav.on{background:var(--card-2);color:var(--ink);font-weight:500}
.nav.on.glow{background:linear-gradient(90deg,var(--card-2) 55%,rgba(108,92,255,.28));overflow:hidden}
.nav.on.glow::after{content:"";position:absolute;right:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 12px 2px var(--accent-glow)}
.nav .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:600;font-size:14px;padding:0 6px}
.badge.mint{background:var(--mint);color:var(--mint-ink)}
.badge.peach{background:var(--peach);color:var(--peach-ink)}
.nav .chev{color:var(--ink-3)}
.tree{margin:2px 0 4px 23px;padding-left:0;display:flex;flex-direction:column;gap:2px;position:relative}
.tree::before{content:"";position:absolute;left:0;top:0;bottom:22px;border-left:1.5px solid var(--card-3)}
.sub{display:flex;align-items:center;gap:8px;height:44px;margin-left:16px;padding:0 12px;border-radius:14px;border:0;background:transparent;color:var(--ink-2);text-align:left;position:relative;font-size:15px}
.sub::before{content:"";position:absolute;left:-16px;top:12px;width:12px;height:10px;border-left:1.5px solid var(--card-3);border-bottom:1.5px solid var(--card-3);border-bottom-left-radius:8px}
.sub.on{background:var(--card-2);color:var(--ink);font-weight:500}
.sub .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.divider{height:1px;background:var(--line);margin:10px 4px}
.group{font-size:13px;color:var(--ink-3);padding:6px 12px 4px}
.ai-card{border:1px solid var(--line-2);border-radius:var(--r-md);padding:14px;margin-top:8px;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.015)}
.ai-card h4{margin:0;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500}
.ai-card h4 em{font-style:normal;color:var(--ink-3)}
.ai-card p{margin:0 0 6px;font-size:13px;color:var(--ink-2);line-height:1.45}
.btn-glow{height:44px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:500;box-shadow:0 0 22px var(--accent-glow);display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-glow:hover{filter:brightness(1.08)}
.btn-glow:active{transform:scale(.98)}
.status-dot{width:8px;height:8px;border-radius:50%;flex:none}
.me{display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);border-radius:var(--r-md);padding:10px 12px;margin-top:10px;background:transparent;width:100%;text-align:left}
.ava{width:40px;height:40px;border-radius:12px;background:var(--card-3);display:grid;place-items:center;font-weight:600;flex:none;color:var(--ink)}
.me .who{flex:1;min-width:0;line-height:1.3}
.me .who b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{font-size:13px;color:var(--ink-3);white-space:nowrap}
.me .ud{display:flex;flex-direction:column;color:var(--ink-3)}
/* rail */
.app.rail .brand b,.app.rail .nav .lbl,.app.rail .nav .badge,.app.rail .nav .chev,.app.rail .search span,.app.rail .search kbd,.app.rail .group,.app.rail .tree,.app.rail .ai-card p,.app.rail .ai-card h4 span,.app.rail .ai-card h4 em,.app.rail .me .who,.app.rail .me .ud{display:none}
.app.rail .brand{justify-content:center;padding-inline:0}
.app.rail .nav,.app.rail .search{justify-content:center;padding:0}
.app.rail .ai-card{padding:8px;border:0;background:transparent}
.app.rail .ai-card h4{display:none}
.app.rail .btn-glow .bl{display:none}
.app.rail .me{justify-content:center;padding:8px;border:0}
.app.rail .nav .rail-dot{display:block}
.rail-dot{display:none;position:absolute;top:8px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--peach)}

/* ---------- main ---------- */
main{min-width:0;display:flex;flex-direction:column;gap:20px;padding-bottom:24px}
.phone-only{display:none}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:14px 4px 4px}
.page-head h1{margin:0;font-size:44px;line-height:1;font-weight:600;letter-spacing:-.035em;flex:1;min-width:200px;text-wrap:balance}
.chip{height:40px;border-radius:14px;border:0;background:var(--card);color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;padding:0 14px;white-space:nowrap}
.chip b{color:var(--ink);font-weight:500}
.chip:hover{background:var(--card-2)}
.chip.accent{background:var(--accent);color:#fff;box-shadow:0 0 18px var(--accent-glow)}
.pills{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.pills::-webkit-scrollbar{display:none}
.pill{height:40px;border-radius:999px;border:0;background:transparent;color:var(--ink-2);padding:0 16px;white-space:nowrap;font-size:15px}
.pill.on{background:var(--card-2);color:var(--ink);font-weight:500}
.grid{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border-radius:var(--r-lg);padding:18px;min-width:0;position:relative;overflow:hidden}
.card.btn{border:0;text-align:left;color:inherit;width:100%;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start}
.card.btn:hover{background:#202126}
.card.span2{grid-column:span 2}
.card.span4{grid-column:1/-1}
.k{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.k svg{color:var(--ink-2)}
.big{font-size:38px;line-height:1.05;font-weight:600;letter-spacing:-.03em;margin-top:10px}
.mid{font-size:24px;font-weight:600;letter-spacing:-.02em}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.foot{font-size:14px;color:var(--ink-2);line-height:1.45;margin-top:10px}
.foot b{color:var(--ink);font-weight:500}
.delta{font-size:13px;color:var(--good);margin-top:6px;display:flex;align-items:center;gap:4px}
.delta.bad{color:var(--bad)}
.h2{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:6px 4px 0}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px 2px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{flex:0 0 clamp(150px,22%,220px)}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-2);flex:none}
.round.solid{background:var(--accent);color:#fff;box-shadow:0 0 0 8px var(--accent-soft)}
.list{background:var(--card);border-radius:var(--r-lg);padding:6px 6px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-radius:14px}
.row+.row{box-shadow:0 -1px 0 var(--line)}
.row.btn{border:0;background:transparent;width:100%;text-align:left}
.row.btn:hover{background:rgba(255,255,255,.03)}
.row .t{flex:1;min-width:0}
.row .t b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{font-size:13px;color:var(--ink-3)}
.loc{font-size:13px;color:var(--ink-2);background:var(--card-2);border:0;border-radius:8px;padding:4px 8px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.loc:hover{background:var(--card-3);color:var(--ink)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap;border:0;background:transparent;padding:4px 0;min-width:76px}
.st i{width:8px;height:8px;border-radius:50%}
.btn{border:0}
.b{height:44px;border-radius:14px;border:0;background:var(--card-2);color:var(--ink);padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;white-space:nowrap}
.b:hover{background:var(--card-3)}
.b:active,.btn-glow:active,.chip:active{transform:scale(.98)}
.b.pri{background:var(--accent);color:#fff;box-shadow:0 0 18px var(--accent-glow)}
.b.pri:hover{filter:brightness(1.08)}
.b.ghost{background:transparent;color:var(--accent-2);padding:0 6px}
input.f,select.f,textarea.f{width:100%;height:46px;background:var(--card-2);border:1px solid transparent;border-radius:14px;padding:0 14px;color:var(--ink);outline:none}
textarea.f{height:auto;padding:12px 14px;resize:vertical;line-height:1.45}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--accent)}
.err{color:var(--bad);font-size:13px;min-height:0}
.seg{display:inline-flex;background:var(--card-2);border-radius:12px;padding:3px;gap:2px}
.seg button{height:34px;border:0;background:transparent;color:var(--ink-2);border-radius:9px;padding:0 12px;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--card-3);color:var(--ink);font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--card-3);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:14px;transition:.25s;z-index:80;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);background:var(--panel);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));z-index:50;transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:92dvh;overflow:auto}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--card-3);margin:0 auto 14px}

/* gauge + mini charts */
.gauge{display:block;margin:4px auto 0;width:100%;max-width:200px}
.minigrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:14px;max-width:220px}
.minigrid i{aspect-ratio:1.6;border-radius:4px;background:var(--card-2);position:relative}
.minigrid i.u{background:var(--card-3)}
.minigrid i.w::after,.minigrid i.x::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.minigrid i.x::after{background:var(--bad)}
.track{position:relative;height:4px;border-radius:2px;background:var(--card-3);margin:26px 0 8px}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.track .knob{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(255,255,255,.08)}

/* storage */
.akro{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.drw{height:64px;border-radius:12px;border:0;background:var(--card-2);color:var(--ink-3);font-size:13px;position:relative;text-align:left;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between}
.drw.has{background:var(--card-3);color:var(--ink)}
.drw.sel{box-shadow:0 0 0 2px var(--accent),0 0 18px var(--accent-glow)}
.drw .d{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%}
.drw small{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.label-prev{background:#fff;color:#111;border-radius:6px;display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,.4)}
pre.zpl{background:var(--bg);border-radius:12px;padding:12px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-2);white-space:pre-wrap;word-break:break-all;margin:12px 0 0}

/* steps */
.prog{display:flex;gap:6px}
.prog button{flex:1;height:22px;border:0;background:transparent;padding:0;display:flex;align-items:center}
.prog button span{width:100%;height:4px;border-radius:2px;background:var(--card-3)}
.prog button.done span{background:var(--accent)}
.prog button.cur span{background:var(--ink)}
.safety{display:flex;gap:10px;align-items:flex-start;color:var(--warn);font-size:14px;background:rgba(242,180,109,.08);border-radius:14px;padding:12px 14px}

/* ---------- 3D viewer ---------- */
.viewer{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:14px;min-height:calc(100dvh - 190px)}
.vcanvas{position:relative;background:#101113;border-radius:var(--r-lg);overflow:hidden;min-height:520px}
.vcanvas canvas{position:absolute;inset:0;display:block;touch-action:none}
.vbar{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.vbar>*{pointer-events:auto}
.vbar .seg{background:rgba(24,25,29,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.vbottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;pointer-events:none}
.vbottom>*{pointer-events:auto}
.slider{background:rgba(24,25,29,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:14px;padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);flex:1;min-width:220px}
.slider input{flex:1;accent-color:var(--accent)}
.slider b{color:var(--ink);font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.vpanel{background:var(--card);border-radius:var(--r-lg);padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px;max-height:calc(100dvh - 190px);overflow:auto}
.vpanel h3{margin:4px 4px 0;font-size:15px;font-weight:600}
.lay{display:flex;align-items:center;gap:10px;height:42px;border-radius:12px;padding:0 10px;border:0;background:transparent;color:var(--ink);width:100%;text-align:left}
.lay:hover{background:rgba(255,255,255,.03)}
.lay .sw{width:14px;height:14px;border-radius:4px;flex:none}
.lay .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.lay .c{font-size:12px;color:var(--ink-3)}
.lay.off .n,.lay.off .c{color:var(--ink-3);text-decoration:line-through}
.props{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.props dt{color:var(--ink-3)}
.props dd{margin:0;text-align:right;overflow-wrap:anywhere}
.bom{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:0;background:transparent;width:100%;text-align:left;color:var(--ink)}
.bom:hover,.bom.on{background:var(--card-2)}
.bom.on{box-shadow:inset 3px 0 0 var(--accent)}
.bom .q{font-weight:600;min-width:38px;text-align:right}
.bom .t{flex:1;min-width:0;font-size:14px;line-height:1.35}
.bom .t span{display:block;font-size:12px;color:var(--ink-3)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:10px;border:2px solid transparent;padding:0}
.swatch.on{border-color:#fff}
.param{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14px}
.param input[type=range]{grid-column:1/-1;accent-color:var(--accent);width:100%}
.param output{color:var(--ink);font-weight:500}
.outliner-in-right{display:none;flex-direction:column;gap:6px}
.stor-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
.hint{position:absolute;right:14px;bottom:70px;font-size:12px;color:var(--ink-3);pointer-events:none}

/* ---------- iPad portrait ---------- */
html.m-compact .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
html.m-compact .viewer{grid-template-columns:minmax(0,1fr) 300px}
html.m-compact .viewer .vleft{display:none}
html.m-compact .viewer .vright .outliner-in-right{display:flex}
html.m-compact .stor-grid{grid-template-columns:minmax(0,1fr)}
/* ---------- iPhone ---------- */
html.m-phone .app{grid-template-columns:minmax(0,1fr);gap:14px;padding-block:6px}
html.m-phone .app.rail{--sbw:0px}

<script>
// Shed calculator, a line-for-line port of workshop_ai/shed.py.
// tests/test_parity.py runs both and fails if any quantity or 3D part differs.
(function (root) {
  const STOCK_FT = [8, 10, 12, 14, 16];
  const SECTION = { '1x4': [0.75, 3.5], '1x6': [0.75, 5.5], '2x4': [1.5, 3.5], '2x6': [1.5, 5.5], '2x8': [1.5, 7.25], '2x10': [1.5, 9.25], '4x4': [3.5, 3.5] };
  const pyRound = (x, nd) => { const m = Math.pow(10, nd); const v = x * m; const f = Math.floor(v); const d = v - f; let r = Math.abs(d - 0.5) < 1e-9 ? (f % 2 === 0 ? f : f + 1) : Math.round(v); return (r / m) + 0; };
  const _r = (x, nd = 2) => pyRound(x, nd);
  const g = (x) => String(+x);
  function stockLen(inches) {
    for (const ft of STOCK_FT) if (ft * 12 >= inches - 1e-6) return ft;
    throw new Error(`a ${(inches / 12).toFixed(1)} ft piece is longer than 16 ft stock`);
  }
  function sheetLayout(across, along, sw = 48, sl = 96) {
    const rows = Math.ceil(across / sw - 1e-9);
    const full = Math.floor(along / sl);
    const rem = along - full * sl;
    let sheets = rows * full;
    if (rem > 1e-6) { const per = Math.max(1, Math.floor(sl / rem)); sheets += Math.ceil(rows / per); }
    return sheets;
  }
  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function fmtIn(inches) {
    const e = Math.round(inches * 8); const whole = Math.floor(e / 8), frac = e % 8;
    if (frac === 0) return `${whole} in`;
    const d = gcd(frac, 8); return `${whole} ${frac / d}/${8 / d} in`;
  }
  const DEFAULTS = { width_ft: 8, depth_ft: 10, wall_height_ft: 8, roof_pitch: 6, overhang_in: 6, door_width_in: 48, door_height_in: 80, windows: 1, window_in: 24 };
  function validate(s) {
    const checks = [
      [6 <= s.width_ft && s.width_ft <= 16, 'width must be 6 to 16 ft'],
      [6 <= s.depth_ft && s.depth_ft <= 16, 'depth must be 6 to 16 ft'],
      [6 <= s.wall_height_ft && s.wall_height_ft <= 10, 'wall height must be 6 to 10 ft'],
      [3 <= s.roof_pitch && s.roof_pitch <= 12, 'roof pitch must be 3 to 12 (rise per 12)'],
      [0 <= s.overhang_in && s.overhang_in <= 18, 'overhang must be 0 to 18 in'],
      [24 <= s.door_width_in && s.door_width_in <= s.width_ft * 12 - 24, 'door must be at least 24 in and leave 12 in of wall each side'],
      [60 <= s.door_height_in && s.door_height_in <= s.wall_height_ft * 12 - 12, 'door must be at least 60 in and fit under a header'],
      [0 <= s.windows && s.windows <= 2, '0 to 2 windows'],
    ];
    const bad = checks.filter(c => !c[0]).map(c => c[1]);
    if (bad.length) throw new Error(bad.join('; '));
  }

  function designShed(input) {
    const spec = { ...DEFAULTS };
    for (const k of Object.keys(DEFAULTS)) if (input && input[k] != null) spec[k] = k === 'windows' ? Math.trunc(+input[k]) : +input[k];
    validate(spec);
    const W = spec.width_ft * 12, D = spec.depth_ft * 12, H = spec.wall_height_ft * 12;
    const p = spec.roof_pitch, o = spec.overhang_in, k = p / 12;
    const slope = Math.sqrt(1 + k * k), pitchDeg = Math.atan(k) * 180 / Math.PI;
    const warnings = [];

    const rafter = spec.width_ft <= 12 ? '2x6' : '2x8';
    const ridge = rafter === '2x6' ? '2x8' : '2x10';
    const rafterOc = spec.width_ft <= 10 ? 24 : 16;
    const joist = '2x6', joistOc = 16, studOc = 16;
    if (spec.width_ft > 12) warnings.push('Spans over 12 ft use 2x8 rafters at 16 in on center. Confirm against your local snow load.');
    if (p < 4) warnings.push('Pitch under 4/12: asphalt shingles need double underlayment. Consider metal roofing.');

    const skids = Math.ceil(W / 48) + 1;
    const skidX = []; for (let i = 0; i < skids; i++) skidX.push(1.75 + i * (W - 3.5) / (skids - 1));
    const padW = spec.width_ft + 2, padD = spec.depth_ft + 2, padSqft = padW * padD;
    const gravelCy = Math.ceil(padSqft * (4 / 12) / 27 * 1.1 * 2) / 2;

    const floorJoists = Math.floor(D / joistOc) + 1;
    const joistLen = W - 3;
    const floorSheets = sheetLayout(W, D);
    const ySkid = SECTION['4x4'][1];
    const yJoistTop = ySkid + SECTION[joist][1];
    const y0 = yJoistTop + 0.75;
    const yTop = y0 + H;

    const studLen = H - 4.5;
    const precut = Math.abs(studLen - 92.625) < 0.01;
    const sideLen = D - 7;
    const walls = [W, W, sideLen, sideLen];
    const studs = walls.reduce((a, L) => a + Math.floor(L / studOc) + 1, 0) + 4 + 4 + 4 * spec.windows;
    const doorHeaderLen = spec.door_width_in + 3;
    const winHeaderLen = spec.window_in + 3;

    const rise = (W / 2) * k;
    const gableHeights = [];
    for (let xg = studOc; xg < W - 0.1; xg += studOc) {
      const h = (W / 2 - Math.abs(xg - W / 2)) * k - 1.5;
      if (h > 6 && Math.abs(xg - W / 2) >= 2) gableHeights.push(h);
    }
    const gableSum = gableHeights.reduce((a, b) => a + b, 0);
    const gablePieces = gableHeights.length ? Math.ceil(2 * gableSum * 1.15 / 96) : 0;

    const plateTop = {}, platePt = {};
    for (const L of walls) {
      const n = Math.ceil(L / 192 - 1e-9); const ft = stockLen(L / n);
      platePt[ft] = (platePt[ft] || 0) + n; plateTop[ft] = (plateTop[ft] || 0) + 2 * n;
    }

    const rd = SECTION[rafter][1];
    const run = W / 2 - 0.75;
    const rafterLen = (run + o) * slope;
    const rafterStock = stockLen(rafterLen + 3);
    const pairs = Math.floor(D / rafterOc) + 1;
    const ties = Math.ceil(pairs / 2);
    const tieLen = W / 2;
    const tieBoards = Math.ceil(ties / Math.max(1, Math.floor(96 / tieLen)));
    const slopeLen = (W / 2 + o) * slope;
    const roofSheets = 2 * sheetLayout(slopeLen, D);
    const roofSqft = 2 * slopeLen * D / 144;
    const squares = roofSqft / 100;
    const bundles = Math.ceil(squares * 3 * 1.10);
    const ridgeCap = Math.max(1, Math.ceil((D / 12) / 30));
    const feltRolls = Math.ceil(roofSqft * 1.10 / 400);
    const dripPieces = Math.ceil((2 * D + 4 * slopeLen) / 120);
    const hTies = pairs * 2;

    const sidingH = yTop - ySkid;
    const panelLen = sidingH <= 96 ? 96 : 108;
    if (sidingH > 108) warnings.push('Over 9 ft of siding height needs a horizontal Z-flashed joint.');
    const wallPanels = [W, W, D, D].reduce((a, L) => a + Math.ceil(L / 48 - 1e-9), 0);
    const gablePanels = Math.ceil(2 * (W * rise / 2) / (48 * 96) * 1.15);
    const sidingPanels = wallPanels + gablePanels;
    const sidingSqft = (2 * W + 2 * D) * sidingH / 144 + W * rise / 144;
    const fasciaBoards = Math.ceil((2 * D + 4 * slopeLen) / 144);

    const sumv = (o) => Object.values(o).reduce((a, b) => a + b, 0);
    const framePieces = skids + floorJoists + 2 + studs + gablePieces + sumv(plateTop) + sumv(platePt) + 2 * pairs + ties;
    const framingLb = Math.ceil(framePieces * 12 / 49);
    const sheathingLb = Math.ceil((roofSheets + sidingPanels) * 70 / 106);
    const deckScrewLb = Math.ceil(floorSheets * 60 / 90);
    const roofingNailLb = Math.ceil(squares * 1.10 * 320 / 140);
    const paintGal = Math.ceil(sidingSqft * 2 / 350);
    const leaves = spec.door_width_in >= 48 ? 2 : 1;

    const M = [];
    const add = (key, group, item, qty, unit, note = '', estimate = false) => M.push({ key, group, item, qty, unit, note, estimate });
    add('gravel', 'Foundation', 'Crushed gravel (3/4 in), 4 in deep', gravelCy, 'cu yd', `${g(padW)} x ${g(padD)} ft pad`);
    add('fabric', 'Foundation', 'Landscape fabric', Math.ceil(padSqft), 'sq ft');
    add('skid', 'Foundation', `4x4 pressure-treated skid, ${stockLen(D)} ft`, skids, 'pcs', 'ground-contact rated');
    add('joist', 'Floor', `2x6 pressure-treated joist, ${stockLen(joistLen)} ft`, floorJoists, 'pcs', `${joistOc} in on center`);
    add('rim', 'Floor', `2x6 pressure-treated rim, ${stockLen(D)} ft`, 2, 'pcs');
    add('floor_sheet', 'Floor', '3/4 in tongue-and-groove plywood, 4x8', floorSheets, 'sheets');
    if (precut) add('stud', 'Walls', '2x4 precut stud, 92 5/8 in', studs, 'pcs');
    else add('stud', 'Walls', `2x4 stud, ${stockLen(studLen)} ft`, studs, 'pcs', `cut to ${fmtIn(studLen)}`);
    for (const ft of Object.keys(platePt).map(Number).sort((a, b) => a - b)) add('plate_pt', 'Walls', `2x4 pressure-treated bottom plate, ${ft} ft`, platePt[ft], 'pcs');
    for (const ft of Object.keys(plateTop).map(Number).sort((a, b) => a - b)) add('plate_top', 'Walls', `2x4 top plate, ${ft} ft`, plateTop[ft], 'pcs', 'doubled');
    add('door_header', 'Walls', `2x6 door header, ${stockLen(doorHeaderLen)} ft`, 2, 'pcs', 'doubled, 1/2 in plywood spacer');
    if (spec.windows) add('win_header', 'Walls', '2x4 window header stock, 8 ft', Math.ceil(spec.windows * 2 * winHeaderLen / 96), 'pcs');
    if (gablePieces) add('gable_stud', 'Walls', '2x4 gable stud stock, 8 ft', gablePieces, 'pcs');
    add('rafter', 'Roof', `${rafter} rafter, ${rafterStock} ft`, pairs * 2, 'pcs', `${rafterOc} in on center`);
    add('ridge', 'Roof', `${ridge} ridge board, ${stockLen(D)} ft`, 1, 'pcs');
    add('collar', 'Roof', '2x4 collar tie stock, 8 ft', tieBoards, 'pcs', 'every other rafter pair');
    add('roof_sheet', 'Roof', '7/16 in OSB roof sheathing, 4x8', roofSheets, 'sheets');
    add('felt', 'Roof', '#15 felt underlayment, 4-square roll', feltRolls, 'rolls');
    add('drip', 'Roof', 'Drip edge, 10 ft', dripPieces, 'pcs', 'eaves under felt, rakes over');
    add('shingle', 'Roof', 'Architectural shingles', bundles, 'bundles', `${squares.toFixed(1)} squares + 10% waste`);
    add('ridge_cap', 'Roof', 'Ridge cap shingles', ridgeCap, 'bundles', '', true);
    add('siding', 'Siding', `T1-11 siding panel, 4x${panelLen / 12}`, sidingPanels, 'sheets', 'door is cut from the opening');
    add('corner_trim', 'Siding', '1x4 corner trim, 8 ft', 8, 'pcs');
    add('fascia', 'Siding', '1x6 fascia, 12 ft', fasciaBoards, 'pcs');
    add('h_tie', 'Hardware', 'Hurricane tie (H2.5A style)', hTies, 'pcs', 'one per rafter at the wall');
    add('hanger_nail', 'Hardware', 'Hanger nails, 1 1/2 in', hTies * 10, 'pcs', '', true);
    add('hinge', 'Hardware', 'Heavy strap hinges', leaves * 3, 'pcs');
    add('hasp', 'Hardware', 'Hasp and padlock', 1, 'set');
    if (leaves === 2) add('barrel', 'Hardware', 'Barrel bolt (inactive leaf)', 2, 'pcs');
    if (spec.windows) add('window', 'Hardware', `Shed window, ${g(spec.window_in)} x ${g(spec.window_in)} in`, spec.windows, 'pcs');
    add('nails16', 'Fasteners', '16d galvanized framing nails', framingLb, 'lb', '', true);
    add('nails8', 'Fasteners', '8d galvanized ring-shank nails', sheathingLb, 'lb', 'sheathing and siding', true);
    add('deck_screw', 'Fasteners', '2 1/2 in exterior deck screws', deckScrewLb, 'lb', 'floor deck', true);
    add('roof_nail', 'Fasteners', '1 1/4 in roofing nails', roofingNailLb, 'lb', '', true);
    add('paint', 'Finish', 'Exterior paint or stain', paintGal, 'gal', 'two coats', true);
    add('caulk', 'Finish', 'Exterior caulk', 3, 'tubes', '', true);

    const C = [];
    const cut = (part, lumber, qty, len, stock, note = '') => C.push({ part, lumber, qty, length_in: _r(len), length: fmtIn(len), stock_ft: stock, note });
    cut('Skid', '4x4 PT', skids, D, stockLen(D));
    cut('Rim joist', '2x6 PT', 2, D, stockLen(D));
    cut('Floor joist', '2x6 PT', floorJoists, joistLen, stockLen(joistLen));
    cut('Wall stud', '2x4', studs, studLen, precut ? 8 : stockLen(studLen), precut ? 'precut' : '');
    cut('Front and back wall plates', '2x4', 6, W, stockLen(W / Math.ceil(W / 192)), '1 PT bottom + 2 top per wall');
    cut('Side wall plates', '2x4', 6, sideLen, stockLen(sideLen / Math.ceil(sideLen / 192)), '1 PT bottom + 2 top per wall');
    cut('Door header', '2x6', 2, doorHeaderLen, stockLen(doorHeaderLen));
    cut('Door jack stud', '2x4', 2, spec.door_height_in - 1.5, 8);
    cut('Rafter', rafter, pairs * 2, rafterLen, rafterStock, `plumb cut ${pitchDeg.toFixed(1)} deg, 3 1/2 in birdsmouth seat`);
    cut('Ridge board', ridge, 1, D, stockLen(D));
    cut('Collar tie', '2x4', ties, tieLen, 8, `ends cut at ${pitchDeg.toFixed(1)} deg`);
    if (spec.windows) cut('Window header', '2x4', spec.windows * 2, winHeaderLen, 8);
    const uniq = [...new Set(gableHeights.map(h => _r(h, 2)))].sort((a, b) => a - b);
    uniq.forEach((h, i) => { const n = 2 * gableHeights.filter(x => Math.abs(_r(x, 2) - h) < 0.001).length; cut(`Gable stud ${i + 1}`, '2x4', n, h, 8, `top cut at ${pitchDeg.toFixed(1)} deg`); });

    const tools = [
      ['Circular saw', true, 'All framing and sheet cuts'], ['Drill/driver', true, 'Deck screws and pilot holes'],
      ['Framing hammer', true, 'Framing and sheathing nails'], ['Speed square', true, `Marking the ${pitchDeg.toFixed(1)} deg rafter cuts`],
      ['Framing square', true, 'Laying out the birdsmouth'], ['Tape measure, 25 ft', true, 'Everything'],
      ['4 ft level', true, 'Leveling skids and plumbing walls'], ['Chalk line', true, 'Shingle courses and sheet layout'],
      ['Step ladder, 6 ft', true, 'Rafters and roofing'], ['Shovel, rake and hand tamper', true, 'Gravel pad'],
      ['Utility knife', true, 'Felt and shingles'], ['Tin snips', true, 'Drip edge'], ['Sawhorses', true, 'Cutting station'],
      ['Safety glasses, hearing protection, gloves', true, 'All steps'], ['Framing nailer', false, 'Saves hours of hammering'],
      ['Roofing nailer', false, 'Faster, consistent shingle nailing'], ['Miter saw', false, 'Fast, square repeat cuts'],
      ['Impact driver', false, 'Driving long screws'],
    ].map(([name, required, why]) => ({ name, required, why }));

    const steps = [
      ['Check permits and setbacks', 'Call your building department with the footprint and height before buying lumber.', 'Call 811 before digging.', ['foundation']],
      ['Build the gravel pad', `Lay fabric and 4 in of compacted gravel, ${g(padW)} x ${g(padD)} ft, level within 1/4 in.`, 'Tamp in 2 in layers; lift with your legs.', ['foundation']],
      ['Set the skids', `Place ${skids} skids along the depth and level them to each other.`, '', ['foundation']],
      ['Frame the floor', `Nail the rims to ${floorJoists} joists at ${joistOc} in on center. Square it by matching the diagonals.`, 'Wear gloves; treated lumber splinters.', ['floor']],
      ['Lay the floor deck', `Glue and screw ${floorSheets} sheets, staggering the end joints.`, '', ['floor']],
      ['Frame and raise the walls', `Build each wall flat on the deck with ${fmtIn(studLen)} studs at ${studOc} in on center. Raise, plumb, brace, and nail the corners.`, 'Raise walls with a helper; brace before letting go.', ['walls']],
      ['Add the double top plate', 'Overlap the second plate at the corners to lock the walls together.', '', ['walls']],
      ['Cut and set the rafters', `Cut one pattern pair (${fmtIn(rafterLen)}, ${pitchDeg.toFixed(1)} deg plumb cut) and test-fit it. Cut ${pairs * 2}, set the ridge, and nail pairs at ${rafterOc} in on center.`, 'Work from a stable ladder; never stand on the top step.', ['roof_framing']],
      ['Install ties and gable studs', 'Add collar ties, hurricane ties, and the gable-end studs.', '', ['roof_framing', 'walls']],
      ['Sheath the roof', `Nail ${roofSheets} OSB sheets with the long edge across the rafters, staggered.`, "Stay off the roof when it's wet.", ['sheathing']],
      ['Shingle the roof', 'Drip edge on the eaves, felt, drip edge on the rakes, then shingles from the bottom up, then the ridge cap.', 'Use toe boards or a harness above 6/12.', ['roofing']],
      ['Side the walls', `Hang ${sidingPanels} T1-11 panels. Cut out the door opening and save the cutout.`, '', ['siding']],
      ['Build the door and trim', 'Frame the door from the cutout with 2x4 backing, hang it on strap hinges, then add corner trim and fascia.', '', ['openings', 'trim']],
      ['Paint and seal', 'Caulk the trim joints, then prime and paint.', 'Ventilate; wear a mask when spraying.', ['siding', 'trim']],
    ].map(([title, detail, safety, layers]) => ({ title, detail, safety, layers }));

    // ---------------- 3D scene ----------------
    const parts = [];
    const r2 = (v) => _r(v, 2), r4 = (v) => _r(v, 4);
    const beam = (kind, layer, mat, bom, a, b, size, up = [0, 1, 0]) => parts.push({ type: 'beam', kind, layer, material: mat, bom, a: a.map(r2), b: b.map(r2), section: typeof size === 'string' ? [...SECTION[size]] : [...size], up: up.map(r4) });
    const slab = (kind, layer, mat, bom, pts, thickness, normal) => parts.push({ type: 'slab', kind, layer, material: mat, bom, points: pts.map(q => q.map(r2)), thickness, normal: normal.map(r4) });
    const rectZ = (x0, x1, ya, yb, z) => [[x0, ya, z], [x1, ya, z], [x1, yb, z], [x0, yb, z]];
    const rectX = (z0, z1, ya, yb, x) => [[x, ya, z0], [x, ya, z1], [x, yb, z1], [x, yb, z0]];

    slab('Gravel pad', 'foundation', 'gravel', 'gravel', [[-12, 0, -12], [W + 12, 0, -12], [W + 12, 0, D + 12], [-12, 0, D + 12]], 4, [0, -1, 0]);
    for (const x0 of skidX) beam('Skid', 'foundation', 'lumber_pt', 'skid', [x0, ySkid / 2, 0], [x0, ySkid / 2, D], '4x4');
    const yj = ySkid + SECTION[joist][1] / 2;
    for (const x0 of [0.75, W - 0.75]) beam('Rim joist', 'floor', 'lumber_pt', 'rim', [x0, yj, 0], [x0, yj, D], joist);
    for (let i = 0; i < floorJoists; i++) { const z = Math.min(0.75 + i * joistOc, D - 0.75); beam('Floor joist', 'floor', 'lumber_pt', 'joist', [1.5, yj, z], [W - 1.5, yj, z], joist); }
    slab('Floor deck', 'floor', 'plywood', 'floor_sheet', [[0, yJoistTop, 0], [W, yJoistTop, 0], [W, yJoistTop, D], [0, yJoistTop, D]], 0.75, [0, 1, 0]);

    const doorA = W / 2 - spec.door_width_in / 2, doorB = W / 2 + spec.door_width_in / 2;
    const doorTop = y0 + spec.door_height_in;
    const winTop = y0 + Math.min(spec.door_height_in, H - 12);
    const winBot = winTop - spec.window_in;
    const winA = D / 2 - spec.window_in / 2, winB = D / 2 + spec.window_in / 2;

    function studRun(length, place, openings, up) {
      const pos = []; for (let i = 0; i <= Math.floor(length / studOc); i++) pos.push(i * studOc);
      if (pos[pos.length - 1] < length - 1.5) pos.push(length);
      for (let t of pos) {
        t = Math.min(Math.max(t, 0.75), length - 0.75);
        if (openings.some(([a, b]) => a - 2.3 <= t && t <= b + 2.3)) continue;
        beam('Wall stud', 'walls', 'lumber', 'stud', place(t, y0 + 1.5), place(t, yTop - 3), '2x4', up);
      }
    }
    function opening(place, a, b, top, bottom, headerSize, headerBom, kind, up) {
      for (const t of [a - 2.25, b + 2.25]) beam('King stud', 'walls', 'lumber', 'stud', place(t, y0 + 1.5), place(t, yTop - 3), '2x4', up);
      for (const t of [a - 0.75, b + 0.75]) beam('Jack stud', 'walls', 'lumber', 'stud', place(t, bottom == null ? y0 + 1.5 : bottom - 1.5), place(t, top), '2x4', up);
      const hd = SECTION[headerSize][1];
      beam(`${kind} header`, 'walls', 'lumber', headerBom, place(a - 1.5, top + hd / 2), place(b + 1.5, top + hd / 2), headerSize, [0, 1, 0]);
      if (bottom != null) beam(`${kind} sill`, 'walls', 'lumber', 'win_header', place(a, bottom - 0.75), place(b, bottom - 0.75), [3.5, 1.5]);
      for (let t = a + 8; t < b - 4; t += studOc) {
        if (top + hd < yTop - 4) beam('Cripple', 'walls', 'lumber', 'stud', place(t, top + hd), place(t, yTop - 3), '2x4', up);
        if (bottom != null && bottom - 1.5 > y0 + 4) beam('Cripple', 'walls', 'lumber', 'stud', place(t, y0 + 1.5), place(t, bottom - 1.5), '2x4', up);
      }
    }
    const front = (t, y) => [t, y, 1.75], back = (t, y) => [t, y, D - 1.75];
    const left = (t, y) => [1.75, y, t], right = (t, y) => [W - 1.75, y, t];
    const ZN = [0, 0, 1], XN = [1, 0, 0];
    studRun(W, front, [[doorA, doorB]], ZN);
    opening(front, doorA, doorB, doorTop, null, '2x6', 'door_header', 'Door', ZN);
    studRun(W, back, [], ZN);
    const sideOpen = [[winA - 3.5, winB - 3.5]];
    studRun(sideLen, (t, y) => left(3.5 + t, y), spec.windows >= 1 ? sideOpen : [], XN);
    studRun(sideLen, (t, y) => right(3.5 + t, y), spec.windows >= 2 ? sideOpen : [], XN);
    if (spec.windows >= 1) opening(left, winA, winB, winTop, winBot, '2x4', 'win_header', 'Window', XN);
    if (spec.windows >= 2) opening(right, winA, winB, winTop, winBot, '2x4', 'win_header', 'Window', XN);
    const plateRows = [[y0 + 0.75, 'lumber_pt', 'plate_pt'], [yTop - 2.25, 'lumber', 'plate_top'], [yTop - 0.75, 'lumber', 'plate_top']];
    for (const zc of [1.75, D - 1.75]) for (const [yy, mat, bom] of plateRows) {
      if (bom === 'plate_pt' && zc === 1.75) {
        beam('Bottom plate', 'walls', mat, bom, [0, yy, zc], [doorA - 1.5, yy, zc], [3.5, 1.5]);
        beam('Bottom plate', 'walls', mat, bom, [doorB + 1.5, yy, zc], [W, yy, zc], [3.5, 1.5]);
      } else beam(bom === 'plate_pt' ? 'Bottom plate' : 'Top plate', 'walls', mat, bom, [0, yy, zc], [W, yy, zc], [3.5, 1.5]);
    }
    for (const xc of [1.75, W - 1.75]) for (const [yy, mat, bom] of plateRows)
      beam(bom === 'plate_pt' ? 'Bottom plate' : 'Top plate', 'walls', mat, bom, [xc, yy, 3.5], [xc, yy, D - 3.5], [3.5, 1.5]);
    for (const zc of [1.75, D - 1.75]) for (let xg = studOc; xg < W - 0.1; xg += studOc) {
      const h = (W / 2 - Math.abs(xg - W / 2)) * k - 1.5;
      if (h > 6 && Math.abs(xg - W / 2) >= 2) beam('Gable stud', 'walls', 'lumber', 'gable_stud', [xg, yTop, zc], [xg, yTop + h, zc], '2x4', ZN);
    }

    const lift = rd * slope / 2;
    const yRidge = yTop + rise + lift;
    beam('Ridge board', 'roof_framing', 'lumber', 'ridge', [W / 2, yRidge, 0], [W / 2, yRidge, D], ridge);
    const rafterZ = []; for (let i = 0; i < pairs; i++) rafterZ.push(Math.min(0.75 + i * rafterOc, D - 0.75));
    for (const z of rafterZ) for (const sgn of [-1, 1]) {
      const xa = W / 2 + sgn * (W / 2 + o);
      beam('Rafter', 'roof_framing', 'lumber', 'rafter', [xa, yTop - o * k + lift, z], [W / 2 - sgn * 0.75, yRidge, z], rafter, [-sgn * k / slope, 1 / slope, 0]);
    }
    rafterZ.forEach((z, i) => { if (i % 2 === 0) { const yt = yTop + rise * 2 / 3; beam('Collar tie', 'roof_framing', 'lumber', 'collar', [W / 2 - tieLen / 2, yt, z], [W / 2 + tieLen / 2, yt, z], '2x4'); } });

    for (const sgn of [-1, 1]) {
      const nx = sgn * k / slope, ny = 1 / slope;
      const xe = W / 2 + sgn * (W / 2 + o);
      const ye = yTop - o * k + rd * slope;
      const yr = yTop + rise + rd * slope;
      const base = [[xe, ye, 0], [xe, ye, D], [W / 2, yr, D], [W / 2, yr, 0]];
      slab('Roof sheathing', 'sheathing', 'osb', 'roof_sheet', base, 0.4375, [nx, ny, 0]);
      const off = 0.4375;
      const top = base.map(q => [q[0] + nx * off, q[1] + ny * off, q[2]]);
      const ext = 0.75;
      top[0] = [top[0][0] + sgn * ext / slope, top[0][1] - k * ext / slope, -1.5];
      top[1] = [top[1][0] + sgn * ext / slope, top[1][1] - k * ext / slope, D + 1.5];
      top[2][2] = D + 1.5; top[3][2] = -1.5;
      slab('Shingles', 'roofing', 'shingle', 'shingle', top, 0.3, [nx, ny, 0]);
      beam('Fascia', 'trim', 'trim', 'fascia', [xe + sgn * 0.375, ye - rd * slope / 2, 0], [xe + sgn * 0.375, ye - rd * slope / 2, D], '1x6', [0, 1, 0]);
    }
    beam('Ridge cap', 'roofing', 'shingle', 'ridge_cap', [W / 2, yTop + rise + rd * slope + 0.9, -1.5], [W / 2, yTop + rise + rd * slope + 0.9, D + 1.5], [12, 0.5]);

    const ys = ySkid, t11 = 0.59;
    slab('Siding', 'siding', 'siding', 'siding', rectZ(0, doorA, ys, yTop, 0), t11, [0, 0, -1]);
    slab('Siding', 'siding', 'siding', 'siding', rectZ(doorB, W, ys, yTop, 0), t11, [0, 0, -1]);
    slab('Siding', 'siding', 'siding', 'siding', rectZ(doorA, doorB, doorTop, yTop, 0), t11, [0, 0, -1]);
    slab('Siding', 'siding', 'siding', 'siding', rectZ(0, W, ys, yTop, D), t11, [0, 0, 1]);

function gaugeSVG(frac, label, sub) {

  const pt = (a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const [x0, y0] = pt(a0), [x1, y1] = pt(a1);
  const d = `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 1 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
  const ak = a0 + (a1 - a0) * frac, [kx, ky] = pt(ak);
  return `<svg class="gauge" viewBox="0 0 180 150" role="img" aria-label="${esc(label)} ${esc(sub)}"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></linearGradient></defs>
  <path d="${d}" fill="none" stroke="#e1e9f1" stroke-width="12" stroke-linecap="round"/>
  <path d="${d}" fill="none" stroke="url(#gg)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${(L * frac).toFixed(1)} 999"/>
  <rect x="${(kx - 2.5).toFixed(1)}" y="${(ky - 9).toFixed(1)}" width="5" height="18" rx="2.5" fill="#14375c" transform="rotate(${(ak * 180 / Math.PI + 90).toFixed(1)} ${kx.toFixed(1)} ${ky.toFixed(1)})"/>
  <text x="90" y="92" text-anchor="middle" fill="#14375c" font-size="34" font-weight="700" font-family="Inter, system-ui">${esc(label)}</text>
  <text x="90" y="114" text-anchor="middle" fill="#708196" font-size="13" font-family="Inter, system-ui">${esc(sub)}</text></svg>`;
}

const LSIZES = { drawer: ['Drawer 1.5 x 0.5 in', 305, 102], bin: ['Bin 2 x 1 in', 406, 203], shelf: ['Shelf 4 x 2 in', 812, 406] };

// ------------------------------------------------------------ device detection (iPhone / iPad / computer)
function detectDevice() {
  const ua = navigator.userAgent || '', w = window.innerWidth || 1024, h = window.innerHeight || 768;
  const tp = navigator.maxTouchPoints || 0;
  const iPad = /iPad/.test(ua) || (/Macintosh/.test(ua) && tp > 1);
  const iPhone = /iPhone|iPod/.test(ua);
  const auto = iPhone ? 'phone' : iPad ? 'tablet' : (w <= 740 ? 'phone' : (tp > 0 && Math.min(w, h) >= 600 ? 'tablet' : 'desktop'));
  const kind = S.devOverride === 'auto' ? auto : S.devOverride;
  const layout = (kind === 'phone' || w <= 740) ? 'phone' : kind;
  const portrait = h >= w;
  const root = document.documentElement;
  ['dev-phone', 'dev-tablet', 'dev-desktop', 'm-phone', 'm-compact', 'portrait', 'landscape'].forEach(c => root.classList.remove(c));
  root.classList.add('dev-' + kind, portrait ? 'portrait' : 'landscape');
  if (layout === 'phone') root.classList.add('m-phone', 'm-compact');
  else if (w <= 1180) root.classList.add('m-compact');
  const prev = S.device;
  S.device = { auto, kind, layout, portrait, w, h };
  if (kind === 'tablet' && layout !== 'phone' && !S.railManual) S.rail = portrait;
  return !prev || prev.layout !== layout || prev.portrait !== portrait || prev.kind !== kind;
}

  </div>${S.mode !== 'live' ? `<div class="foot">Preview mode: the import shows here but isn't saved.</div>` : ''}
  <div style="display:flex;gap:10px;margin-top:16px"><button class="b" id="imp-cancel" style="flex:1">Cancel</button><button class="b pri" id="imp-go" style="flex:2">Import</button></div>`, () => {

function parseList(text) {
  let fam = 'Other'; const out = [];
  text.split(/\r?\n/).forEach(raw => {
    let line = raw.replace(/^\s*(?:[-*•▪☐☑✓✔]\s*|\[[ xX]?\]\s*|\d+[.)]\s+)/, '').trim();
    if (!line) return;
    if (/:$/.test(line) && !/[\t|,]/.test(line)) { fam = line.slice(0, -1).trim() || fam; return; }
    const parts = line.split(/\t|\s*\|\s*/).length > 1 ? line.split(/\t|\s*\|\s*/) : line.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
    const p = parts.map(s => s.trim().replace(/^"(.*)"$/, '$1')).filter(Boolean);
    if (p.length >= 2) {
      if (/^(family|category|group)$/i.test(p[0])) return;
      out.push({ fam: p[0], item: p[1], qty: p[2] || '' });
    } else out.push({ fam, item: line, qty: '' });
  });

}

    const sp = S.shed; const row = (k, label, min, max, step, fmt) => `<div class="param"><label for="vp-${k}">${label}</label><output id="vo-${k}">${fmt(sp[k])}</output><input type="range" id="vp-${k}" data-vparam="${k}" min="${min}" max="${max}" step="${step}" value="${sp[k]}"></div>`;
    const ft = (x) => `${x} ft`, inch = (x) => `${x} in`;
    return [row('width_ft', 'Width', 6, 16, 1, ft), row('depth_ft', 'Depth', 6, 16, 1, ft), row('wall_height_ft', 'Wall height', 6, 10, 0.5, ft), row('roof_pitch', 'Roof pitch', 3, 12, 1, x => `${x}/12`), row('overhang_in', 'Overhang', 0, 18, 1, inch), row('door_width_in', 'Door width', 24, 72, 4, inch), row('windows', 'Windows', 0, 2, 1, x => String(x))].join('') + `<div class="err" id="v-err">${esc(S.v.err)}</div><div class="dim" style="font-size:13px">Every count updates from the calculator as you drag.</div>`;
  }

  // ---------- events ----------
  let paramT;
  $('viewer').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
    if (d.vmode) { S.v.mode = d.vmode; applyState(); panels(); }
    if (d.vcam) frame(d.vcam);
    if (d.vproj) { S.v.project = d.vproj; S.v.build = 99; S.v.off = {}; build(); }
    if (d.vlayer) { S.v.off[d.vlayer] = !S.v.off[d.vlayer]; applyState(); panels(); }
    if (d.vtab) { S.v.tab = d.vtab; panels(); }
    if (d.vbom) { S.v.bom = S.v.bom === d.vbom ? null : d.vbom; S.v.sel = null; S.v.tab = 'materials'; applyState(); panels(); }
    if (d.vfin) { const [k, n] = d.vfin.split(':'); S.v[k] = n; buildMaterials(); meshes.forEach(m => { const nm = MATS[m.userData.part.material] || MATS.lumber; m.userData.base = nm; }); applyState(); panels(); }
  });
  $('viewer').addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'v-build') { S.v.build = +t.value; applyState(); const sp = data.steps || []; t.parentElement.querySelector('b').textContent = S.v.build >= sp.length ? 'Complete' : `${S.v.build + 1}. ${sp[S.v.build].title}`; }
    if (t.id === 'v-explode') { S.v.explode = +t.value; applyState(); }
    if (t.dataset.vparam) {
      const k = t.dataset.vparam; S.shed[k] = +t.value; $('vo-' + k).textContent = { width_ft: `${t.value} ft`, depth_ft: `${t.value} ft`, wall_height_ft: `${t.value} ft`, roof_pitch: `${t.value}/12`, overhang_in: `${t.value} in`, door_width_in: `${t.value} in`, windows: t.value }[k];
      clearTimeout(paramT); paramT = setTimeout(() => {
        try { const spec = { ...S.shed, door_height_in: Math.min(80, S.shed.wall_height_ft * 12 - 12) }; SHED = ShedCalc.designShed(spec); S.done.shed = SHED.steps.map(() => false); S.steps.shed = 0; S.v.err = ''; build(true); }
        catch (err) { S.v.err = err.message; const el = $('v-err'); if (el) el.textContent = err.message; }
      }, 120);
    }
  });
  api.load = (proj, buildStep) => { S.v.project = proj; S.v.build = buildStep; S.v.off = {}; api.dirty = true; };
  api.show = () => { if (!init()) return; api.resize(); if (api.dirty || !data || data !== (S.v.project === 'shed' ? SHED : data)) build(); else { applyState(); panels(); } };
  api.importFile = (file) => {
    if (!file) return; const r = new FileReader();
    r.onload = () => { try { const j = JSON.parse(r.result); const d = j.design || j; if (!d.scene || !Array.isArray(d.scene.parts)) throw new Error('No scene.parts in that file'); d.summary = d.summary || { title: file.name.replace(/\.json$/i, '') }; d.materials = d.materials || []; api.imported = d; S.v.project = 'import'; S.v.build = 99; go('viewer'); build(); toast(`Loaded ${d.scene.parts.length} parts`); } catch (err) { toast("That file isn't a Workshop scene: " + err.message); } };
    r.readAsText(file);
  };
  return api;
})();

S.area = areaFor(S.screen);
detectDevice();
render();
initStore();
})();

</script>

</body>
